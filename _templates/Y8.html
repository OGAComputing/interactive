<!DOCTYPE html>
<html lang="en">
<head>
<!-- ACTIVITY
title:  Activity Title
type:   Practice
stars:  2
desc:   Short description shown on the hub card (one sentence).
color:  teal
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Title — Year 8 Python</title>

<!-- Shared reset, year-group palette, and ac-* utilities -->
<!-- NOTE: use ../../../shared.css if this file is inside a lesson subfolder (L1_…/file.html) -->
<link rel="stylesheet" href="../../shared.css">

<style>
  /* ── Activity header ─────────────────────────────────── */

  .header {
    background: var(--surface);
    padding: 18px 28px 14px;
    border-bottom: 4px solid var(--accent);
  }
  .header-title {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-inv);
  }
  .header-sub {
    font-size: 0.82rem;
    color: var(--accent-light);
    margin-top: 3px;
  }
  /* Progress dots row below the title */
  .progress-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    align-items: center;
  }
  .pdot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--surface-dim);
    border: 2px solid #3a5a7a;
    transition: background 0.3s, border-color 0.3s;
  }
  .pdot.correct { background: var(--green);  border-color: var(--green); }
  .pdot.wrong   { background: var(--red);    border-color: var(--red);   }
  .pdot.gold    { background: var(--gold);   border-color: var(--gold);  }

  /* ── Glow overlay (green = green tier, gold = gold tier) ── */

  #glow-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; opacity: 0;
    transition: opacity 1.8s ease;
  }
  #glow-overlay.gold  { background: radial-gradient(ellipse at 50% 55%, rgba(251,191,36,.24) 0%, transparent 65%); }
  #glow-overlay.green { background: radial-gradient(ellipse at 50% 55%, rgba(16,185,129,.20) 0%, transparent 65%); }
  #glow-overlay.show  { opacity: 1; }

  /* ── Tab bar (underline style — Year 8 standard) ─────── */

  .tab-bar {
    display: flex;
    background: var(--surface-mid);
    padding: 0 20px;
    gap: 2px;
    overflow-x: auto;
    border-bottom: 1px solid #2a4060;
  }
  .tab {
    padding: 10px 18px 9px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
    user-select: none;
  }
  .tab:hover          { color: var(--accent-light); }
  .tab.active         { color: var(--text-inv); border-bottom-color: var(--accent); }
  .tab.done           { color: var(--gold);     border-bottom-color: var(--gold); }

  /* ── Panels ──────────────────────────────────────────── */

  .panel {
    display: none;
    padding: 28px 28px 48px;
    max-width: 920px;
    margin: 0 auto;
  }
  .panel.active { display: block; }

  /* ── Task header ─────────────────────────────────────── */

  .task-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .task-badge {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-inv);
    background: var(--accent);
    flex-shrink: 0;
  }
  .task-title {
    font-family: var(--font-head);
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--surface);
  }

  /* ── Goal banner ─────────────────────────────────────── */

  .goal {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: #fff;
    border-left: 4px solid var(--accent);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--surface);
    margin-bottom: 18px;
  }

  /* ── Feedback line ───────────────────────────────────── */

  .feedback {
    min-height: 1.4em;
    font-size: 0.88rem;
    font-weight: 600;
    margin-top: 10px;
  }
  .feedback.correct { color: var(--green-dark); }
  .feedback.wrong   { color: var(--red); animation: ac-shake 0.35s ease; }

  .question-card {
    border: 1.5px solid var(--surface-mid);
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
    background: var(--surface);
  }
  .question-card.is-wrong,
  .card.is-wrong,
  .panel.is-wrong {
    border-color: var(--red);
    background: rgba(220,38,38,.08);
  }

  /* ── Row layout helper ───────────────────────────────── */

  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>

<body>

<!-- Completion banner — shown when all tasks finished -->
<div id="done-banner" class="ac-banner gold">
  🏆 All tasks complete — great work!
</div>
<div id="glow-overlay"></div>

<!-- Activity header -->
<div class="header">
  <div class="header-title">Activity Title</div>
  <div class="header-sub">Year 8 Python</div>
  <!-- One dot per task — add/remove to match task count -->
  <div class="progress-row" id="progress-row">
    <span class="pdot" id="dot-0"></span>
    <span class="pdot" id="dot-1"></span>
  </div>
</div>

<!-- Tab bar — one .tab per task -->
<div class="tab-bar" id="tab-bar">
  <button class="tab active" data-idx="0">Task 1</button>
  <button class="tab"        data-idx="1">Task 2</button>
</div>

<!-- ── Task 1 ───────────────────────────────────────────── -->
<div class="panel active" id="panel-0">
  <div class="task-header">
    <div class="task-badge">1</div>
    <div>
      <div class="task-title">Task 1 Title</div>
    </div>
  </div>

  <div class="goal">🎯 What the student needs to do or produce.</div>

  <!-- Keep each answer inside a question-card so it can be highlighted when wrong. -->
  <div class="question-card" id="q-0">
    <p style="color:var(--muted); font-size:0.9rem;">Task 1 content goes here.</p>
  </div>

  <div class="row">
    <button class="ac-btn" onclick="checkTask(0)">Check answer</button>
    <button class="ac-btn-secondary" id="reset-0" onclick="resetTask(0)" style="display:none;font-size:0.78rem;">&#8634; Try for Gold</button>
  </div>
  <div class="feedback" id="feedback-0"></div>
</div>

<!-- ── Task 2 ───────────────────────────────────────────── -->
<div class="panel" id="panel-1">
  <div class="task-header">
    <div class="task-badge">2</div>
    <div>
      <div class="task-title">Task 2 Title</div>
    </div>
  </div>

  <div class="goal">🎯 What the student needs to do or produce.</div>

  <!-- Keep each answer inside a question-card so it can be highlighted when wrong. -->
  <div class="question-card" id="q-1">
    <p style="color:var(--muted); font-size:0.9rem;">Task 2 content goes here.</p>
  </div>

  <div class="row">
    <button class="ac-btn" onclick="checkTask(1)">Check answer</button>
    <button class="ac-btn-secondary" id="reset-1" onclick="resetTask(1)" style="display:none;font-size:0.78rem;">&#8634; Try for Gold</button>
  </div>
  <div class="feedback" id="feedback-1"></div>
</div>

<!-- Toast for Classroom feedback -->
<div class="ac-toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────
  const TASK_COUNT  = 2;                          // update if you add/remove tasks
  const completed   = new Array(TASK_COUNT).fill(false);
  // firstAttempt[i] starts true; set to false on any wrong answer before markDone.
  // Excluded tasks (open-text, code) keep their default true and do not track mistakes.
  const firstAttempt = new Array(TASK_COUNT).fill(true);

  // ── Tab switching ──────────────────────────────────────
  document.getElementById('tab-bar').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    const idx = +tab.dataset.idx;

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

    tab.classList.add('active');
    document.getElementById('panel-' + idx).classList.add('active');
  });

  // ── Check answer ───────────────────────────────────────
  function checkTask(idx) {
    if (!window.Classroom?.verifyAuth()) return;

    // TODO: replace this stub with your actual answer-checking logic.
    const isCorrect = true;
    setAnswerState('q-' + idx, isCorrect);

    const feedback = document.getElementById('feedback-' + idx);
    if (isCorrect) {
      feedback.textContent = '✅ Correct!';
      feedback.className   = 'feedback correct';
      markDone(idx);
    } else {
      firstAttempt[idx] = false;   // wrong answer — no longer first-attempt
      feedback.textContent = '❌ Not quite — try again.';
      feedback.className   = 'feedback wrong';
    }
  }

  // ── Mark a task done ───────────────────────────────────
  function markDone(idx) {
    if (completed[idx]) return;
    completed[idx] = true;

    const isGold = firstAttempt[idx];
    document.getElementById('dot-' + idx).className = 'pdot ' + (isGold ? 'gold' : 'correct');

    const tab = document.querySelector('.tab[data-idx="' + idx + '"]');
    if (tab) tab.classList.add('done');

    // Reveal "Try for Gold" button only when the task was completed without first-attempt
    const resetBtn = document.getElementById('reset-' + idx);
    if (resetBtn) resetBtn.style.display = isGold ? 'none' : '';

    // Mastery scoring: 0–80 for completing tasks, +20 bonus for first-attempt correctness
    const done     = completed.filter(Boolean).length;
    const mastered = completed.filter((c, i) => c && firstAttempt[i]).length;
    const pct      = Math.round((done / TASK_COUNT * 80) + (mastered / TASK_COUNT * 20));
    window.ActivityUI?.setScore(pct);
    window.Classroom?.submitGrade(pct, 'Activity Title');

    if (completed.every(Boolean)) allComplete();
  }

  // ── Reset a task so the student can try for Gold ───────
  function resetTask(idx) {
    completed[idx]    = false;
    firstAttempt[idx] = true;

    document.getElementById('dot-' + idx).className = 'pdot';
    const fb = document.getElementById('feedback-' + idx);
    fb.textContent = ''; fb.className = 'feedback';
    document.getElementById('reset-' + idx).style.display = 'none';
    setAnswerState('q-' + idx, true);

    // Hide all-done state so it can fire again after the retry
    document.getElementById('done-banner').classList.remove('show', 'gold', 'green');
    const glow = document.getElementById('glow-overlay');
    if (glow) glow.classList.remove('show', 'gold', 'green');
    window.ActivityUI?.resetCelebration();

    const done     = completed.filter(Boolean).length;
    const mastered = completed.filter((c, i) => c && firstAttempt[i]).length;
    const pct      = Math.round((done / TASK_COUNT * 80) + (mastered / TASK_COUNT * 20));
    window.ActivityUI?.setScore(pct);
    window.Classroom?.submitGrade(pct, 'Activity Title');
  }

  // ── All tasks complete ─────────────────────────────────
  function allComplete() {
    const allGold = firstAttempt.every(Boolean);
    const tier    = allGold ? 'gold' : 'green';
    document.getElementById('done-banner').classList.add('show', tier);
    const glow = document.getElementById('glow-overlay');
    if (glow) glow.classList.add(tier, 'show');
    const mastered = firstAttempt.filter(Boolean).length;
    const pct = Math.round(80 + (mastered / TASK_COUNT * 20));
    window.ActivityUI?.launchCelebration({ percent: pct });
  }

  // ── Toast helper ───────────────────────────────────────
  // Highlight the specific answer/question block that needs attention.
  function setAnswerState(target, ok) {
    const el = typeof target === 'string' ? document.getElementById(target) : target;
    const block = el?.closest('.question-card, .card, .panel');
    if (block) block.classList.toggle('is-wrong', !ok);
  }

  const launchCelebration = (options) => window.ActivityUI?.launchCelebration(options);
  const showToast = (msg, type = '') => window.ActivityUI?.showToast(msg, type);
</script>

<script src="../../activity-ui.js"></script>
<!-- Google Classroom integration (no-op when no ?courseId= param) -->
<!-- NOTE: use ../../../classroom.js if this file is inside a lesson subfolder (L1_…/file.html) -->
<script src="../../classroom.js"></script>
</body>
</html>
