<!DOCTYPE html>
<html lang="en">
<head>
<!-- ACTIVITY
title:  Activity Title
type:   Practice
stars:  3
desc:   Short description shown on the hub card (one sentence).
color:  blue
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Title — Year 9</title>

<!--
  Google Fonts — remove this link if you want to avoid the network request.
  Year 9 standard fonts: DM Sans (body) + Space Mono (headings/code).
  If removing, the font-body/font-head variables in shared.css fall back
  to system fonts automatically.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap">

<!-- Shared reset, year-group palette, and ac-* utilities -->
<!-- NOTE: use ../../../shared.css if this file is inside a lesson subfolder (L1_…/file.html) -->
<link rel="stylesheet" href="../../shared.css">

<style>
  /* ── Page heading ────────────────────────────────────── */

  .page-eyebrow {
    font-family: var(--font-head);
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 4px;
  }
  .page-title {
    font-size: 1.6rem;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    margin-bottom: 6px;
  }
  .page-subtitle {
    text-align: center;
    font-family: var(--font-head);
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 32px;
    letter-spacing: 0.5px;
  }

  /* ── Pill tab bar ────────────────────────────────────── */

  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .tab-btn {
    padding: 8px 22px;
    border: 2px solid var(--surface-mid);
    border-radius: 20px;
    background: var(--surface);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    user-select: none;
  }
  .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }
  .tab-btn.active   { background: var(--accent);    border-color: var(--accent);    color: var(--text-inv); }
  .tab-btn.done-green { background: var(--green);   border-color: var(--green);     color: #fff; }
  .tab-btn.done-gold  { background: var(--gold);    border-color: var(--gold);      color: #111; }

  /* ── Panels ──────────────────────────────────────────── */

  .panel {
    display: none;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 16px 60px;
    animation: ac-fade-in 0.2s ease;
  }
  .panel.active { display: block; }

  /* ── Section card ────────────────────────────────────── */

  .card {
    background: var(--surface);
    border: 1px solid var(--surface-mid);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .card-title {
    font-family: var(--font-head);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  /* ── Goal banner ─────────────────────────────────────── */

  .goal {
    background: var(--surface);
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 20px;
  }

  /* ── Feedback line ───────────────────────────────────── */

  .feedback {
    min-height: 1.4em;
    font-size: 0.88rem;
    font-weight: 600;
    margin-top: 12px;
  }
  .feedback.correct { color: var(--green); }
  .feedback.wrong   { color: var(--red); animation: ac-shake 0.35s ease; }

  .question-card {
    border: 1.5px solid var(--surface-mid);
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
    background: var(--surface);
  }
  .question-card.is-wrong,
  .card.is-wrong,
  .panel.is-wrong {
    border-color: var(--red);
    background: rgba(220,38,38,.08);
  }

  /* ── Progress dots ───────────────────────────────────── */

  .progress-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .pdot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--surface-mid);
    transition: background 0.3s;
  }
  .pdot.done  { background: var(--gold); }
  .pdot.green { background: var(--green); }

  /* ── Row layout helper ───────────────────────────────── */

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }

  /* ── Page wrapper padding ────────────────────────────── */

  .page-wrap { padding: 32px 16px 0; }
</style>
</head>

<body>
<!--
  Change data-topic to match the folder name:
  Hardware_Networks | Algorithms | Cybersecurity | Databases
  (or add a new entry to shared.css if needed)
-->

<!-- Completion banner -->
<div id="done-banner" class="ac-banner gold">
  🏆 All tasks complete — excellent work!
</div>

<div class="page-wrap">
  <!-- Page heading -->
  <div class="page-eyebrow">Year 9 · Hardware &amp; Networks</div>
  <h1 class="page-title">Activity Title</h1>
  <p class="page-subtitle">Topic / Unit Name</p>

  <!-- Progress dots — one per task -->
  <div class="progress-row">
    <div class="pdot" id="dot-0"></div>
    <div class="pdot" id="dot-1"></div>
  </div>

  <!-- Pill tabs — one per task -->
  <div class="tabs" id="tab-bar">
    <button class="tab-btn active" data-idx="0">Task 1</button>
    <button class="tab-btn"        data-idx="1">Task 2</button>
  </div>

  <!-- ── Task 1 ─────────────────────────────────────────── -->
  <div class="panel active" id="panel-0">
    <div class="goal">🎯 What the student needs to do or produce.</div>

    <div class="card">
      <div class="card-title">Instructions</div>
      <!-- Keep each answer inside a question-card so it can be highlighted when wrong. -->
      <div class="question-card" id="q-0">
        <p style="color:var(--text); font-size:0.9rem; line-height:1.7;">
          Task 1 content goes here.
        </p>
      </div>
    </div>

    <div class="row">
      <button class="ac-btn" onclick="checkTask(0)">Check answer</button>
    </div>
    <div class="feedback" id="feedback-0"></div>
  </div>

  <!-- ── Task 2 ─────────────────────────────────────────── -->
  <div class="panel" id="panel-1">
    <div class="goal">🎯 What the student needs to do or produce.</div>

    <div class="card">
      <div class="card-title">Instructions</div>
      <!-- Keep each answer inside a question-card so it can be highlighted when wrong. -->
      <div class="question-card" id="q-1">
        <p style="color:var(--text); font-size:0.9rem; line-height:1.7;">
          Task 2 content goes here.
        </p>
      </div>
    </div>

    <div class="row">
      <button class="ac-btn" onclick="checkTask(1)">Check answer</button>
    </div>
    <div class="feedback" id="feedback-1"></div>
  </div>
</div><!-- /.page-wrap -->

<!-- Toast for Classroom feedback -->
<div class="ac-toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────
  const TASK_COUNT = 2;                          // update if you add/remove tasks
  const completed  = new Array(TASK_COUNT).fill(false);

  // ── Tab switching ──────────────────────────────────────
  document.getElementById('tab-bar').addEventListener('click', e => {
    const tab = e.target.closest('.tab-btn');
    if (!tab) return;
    const idx = +tab.dataset.idx;

    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

    tab.classList.add('active');
    document.getElementById('panel-' + idx).classList.add('active');
  });

  // ── Check answer ───────────────────────────────────────
  function checkTask(idx) {
    if (!window.Classroom?.verifyAuth()) return;

    // TODO: replace this stub with your actual answer-checking logic.
    const isCorrect = true;
    setAnswerState('q-' + idx, isCorrect);

    const feedback = document.getElementById('feedback-' + idx);
    if (isCorrect) {
      feedback.textContent = '✅ Correct!';
      feedback.className   = 'feedback correct';
      markDone(idx, 'gold');
    } else {
      feedback.textContent = '❌ Not quite — try again.';
      feedback.className   = 'feedback wrong';
    }
  }

  // ── Mark a task done ───────────────────────────────────
  // type: 'green' (all correct) | 'gold' (complete with help)
  function markDone(idx, type = 'gold') {
    if (completed[idx]) return;
    completed[idx] = true;

    document.getElementById('dot-' + idx).className = type === 'green' ? 'pdot green' : 'pdot done';

    const tab = document.querySelector('.tab-btn[data-idx="' + idx + '"]');
    if (tab) tab.classList.add('done-' + type);

    // Submit grade (and trigger work evidence upload) after every task, not
    // just at the end — so evidence is always current as the student progresses.
    const pct = Math.round(completed.filter(Boolean).length / TASK_COUNT * 100);
    window.Classroom?.submitGrade(pct, 'Activity Title');

    if (completed.every(Boolean)) {
      allComplete();
    }
  }

  // ── All tasks complete ─────────────────────────────────
  function allComplete() {
    document.getElementById('done-banner').classList.add('show');
    launchCelebration();
    // Grade (100%) already submitted via markDone — no extra call needed.
  }

  // ── Toast helper ───────────────────────────────────────
  // Highlight the specific answer/question block that needs attention.
  function setAnswerState(target, ok) {
    const el = typeof target === 'string' ? document.getElementById(target) : target;
    const block = el?.closest('.question-card, .card, .panel');
    if (block) block.classList.toggle('is-wrong', !ok);
  }

  function launchCelebration() {
    if (window._celebrationShown || window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
    window._celebrationShown = true;
    const effects = [runConfetti, runFireworks, runShootingStars, runBadgePop, runXpBurst, runPixelSparkle, runLevelUpFlash, runMatrixTick];
    effects[Math.floor(Math.random() * effects.length)]();
  }

  function runConfetti() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    const colors = ['#facc15', '#22c55e', '#38bdf8', '#f472b6', '#fb7185'];
    const pieces = Array.from({ length: 120 }, () => ({
      x: Math.random() * innerWidth,
      y: -20 - Math.random() * innerHeight * 0.35,
      vx: -2 + Math.random() * 4,
      vy: 2 + Math.random() * 4,
      size: 5 + Math.random() * 7,
      spin: Math.random() * Math.PI,
      color: colors[Math.floor(Math.random() * colors.length)]
    }));
    let frame = 0;
    function draw() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.spin += 0.18;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();
      });
      frame++;
      if (frame < 140) requestAnimationFrame(draw);
      else canvas.remove();
    }
    draw();
  }

  function runFireworks() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    const colors = ['#facc15', '#22c55e', '#38bdf8', '#f472b6', '#fb7185'];
    const bursts = Array.from({ length: 6 }, (_, burst) => {
      const x = innerWidth * (0.15 + Math.random() * 0.7);
      const y = innerHeight * (0.18 + Math.random() * 0.45);
      return Array.from({ length: 28 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.4 + Math.random() * 3.2;
        return { x, y, delay: burst * 18, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 80, color: colors[Math.floor(Math.random() * colors.length)] };
      });
    }).flat();
    let frame = 0;
    function draw() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bursts.forEach(p => {
        if (frame < p.delay || p.life <= 0) return;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.life--;
        ctx.globalAlpha = Math.max(p.life / 80, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
      frame++;
      if (frame < 180) requestAnimationFrame(draw);
      else canvas.remove();
    }
    draw();
  }

  function runShootingStars() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    const stars = Array.from({ length: 18 }, (_, i) => ({
      x: -120 - Math.random() * innerWidth,
      y: Math.random() * innerHeight * 0.55,
      delay: i * 7,
      speed: 9 + Math.random() * 5,
      size: 2 + Math.random() * 2
    }));
    let frame = 0;
    function draw() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        if (frame < s.delay) return;
        s.x += s.speed;
        s.y += s.speed * 0.32;
        const trail = 70;
        const grad = ctx.createLinearGradient(s.x - trail, s.y - trail * 0.32, s.x, s.y);
        grad.addColorStop(0, 'rgba(250,204,21,0)');
        grad.addColorStop(1, 'rgba(250,204,21,0.95)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = s.size;
        ctx.beginPath();
        ctx.moveTo(s.x - trail, s.y - trail * 0.32);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
      frame++;
      if (frame < 150) requestAnimationFrame(draw);
      else canvas.remove();
    }
    draw();
  }

  function runBadgePop() {
    const badge = document.createElement('div');
    badge.textContent = '100%';
    badge.style.cssText = 'position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.4);z-index:9999;pointer-events:none;background:var(--gold,#facc15);color:#111;border:4px solid #fff;border-radius:999px;width:150px;height:150px;display:grid;place-items:center;font-weight:900;font-size:2.4rem;box-shadow:0 18px 50px rgba(0,0,0,.35);opacity:0;transition:transform .55s cubic-bezier(.2,1.4,.3,1),opacity .25s;';
    document.body.appendChild(badge);
    requestAnimationFrame(() => { badge.style.opacity = '1'; badge.style.transform = 'translate(-50%,-50%) scale(1) rotate(8deg)'; });
    setTimeout(() => { badge.style.opacity = '0'; badge.style.transform = 'translate(-50%,-55%) scale(.85) rotate(-6deg)'; }, 1300);
    setTimeout(() => badge.remove(), 1800);
  }

  function runXpBurst() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    const bits = Array.from({ length: 34 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 260, y: innerHeight * .62 + Math.random() * 40, vx: (Math.random() - .5) * 3, vy: -4 - Math.random() * 4, life: 70 + Math.random() * 35, text: Math.random() > .25 ? '+XP' : '+100' }));
    let frame = 0;
    function draw() {
      canvas.width = innerWidth; canvas.height = innerHeight; ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '800 22px sans-serif'; ctx.textAlign = 'center';
      bits.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.life--; ctx.globalAlpha = Math.max(p.life / 90, 0); ctx.fillStyle = '#facc15'; ctx.fillText(p.text, p.x, p.y); });
      ctx.globalAlpha = 1; frame++;
      if (frame < 110) requestAnimationFrame(draw); else canvas.remove();
    }
    draw();
  }

  function runPixelSparkle() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    const colors = ['#38bdf8', '#22c55e', '#facc15', '#f472b6'];
    const pixels = Array.from({ length: 150 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, size: 4 + Math.random() * 9, life: 45 + Math.random() * 60, color: colors[Math.floor(Math.random() * colors.length)] }));
    let frame = 0;
    function draw() {
      canvas.width = innerWidth; canvas.height = innerHeight; ctx.clearRect(0, 0, canvas.width, canvas.height);
      pixels.forEach(p => { p.life--; const pulse = Math.sin((frame + p.size) * .25) * 0.5 + 0.5; ctx.globalAlpha = Math.max(p.life / 80, 0) * pulse; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
      ctx.globalAlpha = 1; frame++;
      if (frame < 120) requestAnimationFrame(draw); else canvas.remove();
    }
    draw();
  }

  function runLevelUpFlash() {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<div>LEVEL COMPLETE</div><strong>100%</strong>';
    wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;display:grid;place-items:center;text-align:center;background:rgba(0,0,0,.18);color:white;font-family:sans-serif;font-weight:900;letter-spacing:.08em;text-shadow:0 4px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;';
    wrap.firstChild.style.cssText = 'font-size:clamp(1.6rem,6vw,4.5rem);';
    wrap.lastChild.style.cssText = 'display:block;font-size:clamp(2.2rem,9vw,7rem);color:#facc15;';
    document.body.appendChild(wrap);
    requestAnimationFrame(() => { wrap.style.opacity = '1'; });
    setTimeout(() => { wrap.style.opacity = '0'; }, 1200);
    setTimeout(() => wrap.remove(), 1600);
  }

  function runMatrixTick() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;background:rgba(0,0,0,.18);';
    document.body.appendChild(canvas);
    let drops = [];
    let frame = 0;
    function draw() {
      canvas.width = innerWidth; canvas.height = innerHeight;
      if (!drops.length) drops = Array.from({ length: Math.ceil(canvas.width / 18) }, () => Math.random() * -40);
      ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#22c55e'; ctx.font = '18px monospace';
      drops.forEach((y, i) => { const x = i * 18; ctx.fillText(Math.random() > .5 ? '1' : '0', x, y); drops[i] = y > canvas.height + 20 ? 0 : y + 18; });
      if (frame > 70) { ctx.fillStyle = '#facc15'; ctx.font = '900 86px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('100%', canvas.width / 2, canvas.height / 2); }
      frame++;
      if (frame < 140) requestAnimationFrame(draw); else canvas.remove();
    }
    draw();
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'ac-toast show' + (type ? ' ' + type : '');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>

<!-- Google Classroom integration (no-op when no ?courseId= param) -->
