name: Test and Deploy

on:
  push:
    branches: [main]
    # Skip the auto-commits from build-manifest (they use [skip ci] but
    # this double-guards against triggering tests on manifest-only commits)
    paths-ignore:
      - 'activities.json'
      - 'meta.json'
  pull_request:

# Serialise deployments to the single github-pages environment. Rapid
# successive pushes previously launched overlapping deploys that knocked
# each other out (actions/deploy-pages failing). Queue them instead of
# cancelling, so an in-flight deploy always finishes cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unit:
    # Vitest: checker logic, the PRIMM template drift check and the shared-dependency check. Seconds, not minutes.
    name: unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

  test:
    # The E2E suite is CPU-bound (each Python activity boots Pyodide), so it is split
    # across four runners that work in parallel. Deploy waits for all four to pass.
    name: test (shard ${{ matrix.shard }}/4)
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.59 can't install
    # browser dependencies for. Move back once Playwright supports it.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [unit, test]
    runs-on: ubuntu-latest
    # Only deploy on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the current tip of main, NOT the commit that triggered
      # this run. The build-manifest workflow rebuilds activities.json /
      # meta.json into a separate [skip ci] commit that lands ~15s after
      # the push; the test job takes several minutes, so by the time this
      # deploy job runs that commit is already on main. Pinning to the
      # trigger SHA (the default) would publish the *previous* manifest and
      # leave the site permanently one activity behind.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v4

      # Name the artifact per attempt: a re-run keeps the earlier attempt's
      # artifact, and deploy-pages refuses to choose between two with the
      # same name ("Multiple artifacts named github-pages").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_attempt }}

      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
