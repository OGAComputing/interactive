<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS Activities</title>
  <style>
    :root {
      --bg: #0f1c2e;
      --bar: #0a1520;
      --surface: #162032;
      --surface-2: #1b283d;
      --line: #1e3048;
      --text: #e8edf2;
      --muted: #8fa9c2;
      --dim: #5f7f9c;
      --accent: #00b4b4;
      --star: #f5a623;
      --bar-h: 120px; /* real value set from JS (header height varies with teacher status) */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }

    body {
      font-family: 'Trebuchet MS', Calibri, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── Sticky top bar: brand + search + teacher tools, then year tabs ── */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    .topbar-row {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; gap: 0.75rem 1rem; flex-wrap: wrap;
      padding: 0.7rem 1.5rem 0.5rem;
    }
    .brand { font-size: 1.15rem; font-weight: 800; white-space: nowrap; color: #fff; }
    .brand span { color: var(--accent); }
    .search { flex: 1 1 220px; max-width: 360px; position: relative; }
    .search input {
      width: 100%; background: var(--surface); color: var(--text);
      border: 1px solid var(--line); border-radius: 8px;
      padding: 0.5rem 0.8rem 0.5rem 2.1rem; font: inherit; font-size: 0.88rem;
    }
    .search input:focus { outline: none; border-color: var(--accent); }
    .search input::placeholder { color: var(--dim); }
    .search svg { position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }

    /* ── Teacher Tools ── */
    .teacher-tools {
      display: flex; align-items: center; gap: 0.5rem 0.75rem; flex-wrap: wrap;
      margin-left: auto;
    }
    .teacher-label { font-size: 0.72rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
    .btn-google {
      background: #fff; color: #000; padding: 6px 12px; border-radius: 6px;
      font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer;
    }
    .guide-link { font-size: 0.75rem; color: var(--muted); text-decoration: none; white-space: nowrap; }
    .guide-link:hover { color: var(--text); }
    #teacher-status, #sync-status { font-size: 0.8rem; color: var(--muted); }
    #teacher-status:empty, #sync-status:empty { display: none; }
    #course-combobox, #topic-combobox {
      position: relative;
      display: none;
      flex-shrink: 0;
    }
    #course-search, #topic-search {
      background: var(--surface); color: var(--text); border: 1px solid var(--line);
      padding: 6px 26px 6px 8px; border-radius: 6px; font-size: 0.8rem;
      width: 200px; font-family: inherit;
    }
    #topic-search { width: 220px; }
    #course-search:focus, #topic-search:focus { outline: none; border-color: var(--accent); }
    #course-search.attention { border-color: var(--star); box-shadow: 0 0 0 3px rgba(245,166,35,0.3); }
    #course-search::placeholder, #topic-search::placeholder { color: var(--dim); }
    #course-chevron, #topic-chevron {
      position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--dim); font-size: 0.6rem;
    }
    #course-dropdown, #topic-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      max-height: 260px;
      overflow-y: auto;
      background: #0d1828;
      border: 1px solid var(--line);
      border-radius: 6px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #course-dropdown.open, #topic-dropdown.open { display: block; }
    .course-option {
      padding: 7px 10px;
      font-size: 0.8rem;
      color: #c8d8e8;
      cursor: pointer;
      white-space: nowrap;
    }
    .course-option:hover, .course-option.focused { background: var(--surface); color: #fff; }
    .course-option.selected { color: var(--accent); }
    .course-no-match { padding: 7px 10px; font-size: 0.8rem; color: var(--dim); }

    /* ── Year tabs ── */
    #year-tabs {
      max-width: 1280px; margin: 0 auto;
      display: flex; gap: 0.25rem;
      padding: 0 1.5rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .year-tab {
      background: none; border: none; font: inherit; cursor: pointer; white-space: nowrap;
      padding: 0.6rem 1rem;
      font-size: 0.9rem; font-weight: 700;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      display: flex; align-items: center; gap: 0.4rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .year-tab:hover { color: var(--text); }
    .year-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .year-tab .count {
      font-size: 0.7rem; background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 0.1em 0.5em;
    }

    /* ── Page: sticky topic sidebar + content ── */
    .page {
      max-width: 1280px; margin: 0 auto;
      display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 2rem;
      padding: 1.5rem 1.5rem 4rem;
    }
    .sidebar {
      position: sticky; top: calc(var(--bar-h) + 1.5rem); align-self: start;
      max-height: calc(100vh - var(--bar-h) - 3rem); overflow-y: auto;
    }
    .sidebar h2 { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 0 0 0.5rem 0.6rem; }
    #toc { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    #toc a {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.6rem; border-radius: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.88rem; line-height: 1.25;
    }
    #toc a:hover { background: var(--surface); color: var(--text); }
    #toc a.active { background: var(--surface-2); color: var(--text); font-weight: 700; }
    #toc .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    #toc .n { margin-left: auto; font-size: 0.72rem; color: var(--dim); }

    /* ── Topic sections ── */
    .topic { margin-bottom: 1.75rem; scroll-margin-top: calc(var(--bar-h) + 1rem); }
    .topic-head {
      width: 100%; display: flex; align-items: center; gap: 0.75rem; cursor: pointer;
      background: var(--surface); border: none; border-left: 5px solid var(--tc); border-radius: 8px;
      padding: 0.8rem 1rem; color: var(--text); font: inherit; text-align: left;
    }
    .topic-head:hover { background: var(--surface-2); }
    .topic-head h3 { font-size: 1.2rem; font-weight: 800; }
    .topic-head .n { font-size: 0.78rem; color: var(--muted); }
    .topic-head .chev { margin-left: auto; color: var(--dim); transition: transform 0.2s; flex-shrink: 0; }
    .topic-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }
    .topic-body { padding-top: 0.9rem; }
    .topic-head[aria-expanded="false"] + .topic-body { display: none; }

    /* Lesson tag on each card: one grid per topic instead of a heading row per lesson */
    .lesson-tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; color: var(--tc, var(--accent)); }
    .lesson-tag b { text-transform: uppercase; letter-spacing: 0.08em; margin-right: 0.35em; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.75rem; }

    /* ── Card: whole card opens the activity; Assign button sits above the link ── */
    .card {
      position: relative;
      display: flex; flex-direction: column; gap: 0.35rem;
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.75rem 0.9rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .card:hover { border-color: var(--tc, var(--accent)); background: var(--surface-2); }
    .card:focus-within { border-color: var(--tc, var(--accent)); }
    .crumb { font-size: 0.7rem; color: var(--dim); }
    .card-title { font-size: 0.95rem; font-weight: 700; line-height: 1.25; }
    .card-title a { color: #fff; text-decoration: none; }
    .card-title a::after { content: ''; position: absolute; inset: 0; border-radius: 8px; }
    .card-title a:focus-visible { outline: none; }
    .card-title a:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card-desc {
      font-size: 0.8rem; color: var(--muted); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: auto; padding-top: 0.2rem; }
    .pill {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0.1em 0.45em;
    }
    .pill.challenge { color: var(--star); border-color: #5a4320; }
    .stars { font-size: 0.72rem; color: var(--star); letter-spacing: 1px; }

    .btn-assign {
      position: relative; z-index: 1; /* above the card's stretched link */
      width: 100%; margin-top: 0.35rem; justify-content: center;
      display: flex; align-items: center; gap: 0.35rem;
      background: var(--accent); color: #0a1520;
      padding: 0.45rem 0.65rem; border-radius: 6px; border: none;
      font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-assign span { overflow: hidden; text-overflow: ellipsis; }
    .btn-assign svg { flex-shrink: 0; }
    .btn-assign:hover { background: #00e0e0; }
    .btn-assign:disabled { opacity: 0.65; cursor: not-allowed; background: var(--accent); }

    /* ── Search results / status ── */
    #results h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 0.8rem; font-weight: 600; }
    .empty { color: var(--muted); padding: 2rem 0; }
    #status { font-size: 0.9rem; color: var(--muted); padding: 2rem 0; }
    #status.error { color: #e05555; }

    /* ── Assign modal ── */
    #assign-modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 99999;
      background: rgba(0,0,0,0.65); align-items: center; justify-content: center;
    }
    #assign-modal-backdrop.open { display: flex; }
    #assign-modal {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 28px 32px; max-width: 520px; width: calc(100% - 48px);
      font-family: 'Segoe UI', system-ui, sans-serif;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    #assign-modal h2 { font-size: 1.1rem; color: #f1f5f9; margin-bottom: 12px; }
    #assign-modal p  { font-size: 0.85rem; color: #94a3b8; line-height: 1.7; margin-bottom: 20px; }
    #assign-modal a  { color: #60a5fa; }
    #assign-modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    #assign-modal-actions button {
      padding: 7px 18px; border: none; border-radius: 6px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .assign-btn-primary   { background: #3b82f6; color: #fff; }
    .assign-btn-primary:hover { background: #2563eb; }
    .assign-btn-secondary { background: #374151; color: #d1d5db; }
    .assign-btn-secondary:hover { background: #4b5563; }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #2a4060;
      padding: 1.5rem;
    }
    footer a { color: #3a6080; text-decoration: none; }
    footer a:hover { color: #7a9ab5; }

    /* ── Sync button ── */
    .btn-inline-ghost {
      background: transparent; color: var(--muted);
      padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line);
      font-size: 0.75rem; cursor: pointer; vertical-align: middle;
    }
    .btn-inline-ghost:hover { color: #c8d8e8; border-color: #3a6080; }
    #build-meta {
      font-size: 0.7rem;
      color: #1e3048;
      margin-top: 0.3rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.03em;
    }

    /* ── Narrow screens: sidebar becomes a sticky row of topic chips ── */
    @media (max-width: 900px) {
      .page { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 0; }
      .sidebar {
        position: sticky; top: var(--bar-h); z-index: 40; max-height: none; overflow: visible;
        background: var(--bg); margin: 0 -1.5rem; padding: 0.6rem 1.5rem; border-bottom: 1px solid var(--line);
      }
      .sidebar h2 { display: none; }
      #toc { flex-direction: row; overflow-x: auto; gap: 0.4rem; scrollbar-width: none; }
      #toc a { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 0.4rem 0.8rem; }
      #content { padding-top: 1rem; }
      .search { max-width: none; }
      .teacher-tools { margin-left: 0; }
    }
    @media (max-width: 600px) {
      .topbar-row { padding: 0.5rem 1rem 0.35rem; gap: 0.5rem; }
      .brand, .teacher-label, .guide-link { display: none; }
      .page { padding-left: 1rem; padding-right: 1rem; }
      .sidebar { margin: 0 -1rem; padding: 0.5rem 1rem; }
      #year-tabs { padding: 0 1rem; }
    }
  </style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-row">
    <h1 class="brand">Activities <span>Hub</span></h1>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only">Search all activities</span>
      <input id="search" type="search" placeholder="Search all activities…  ( / )" autocomplete="off">
    </label>

    <div class="teacher-tools">
      <span class="teacher-label">Teacher Tools</span>
      <button id="btnLogin" class="btn-google" onclick="requestPermission()">Sign in to Assign to Classroom</button>
      <div id="course-combobox">
        <input id="course-search" type="text" placeholder="Select a class…" autocomplete="off" readonly aria-label="Class to assign to">
        <span id="course-chevron">▼</span>
        <div id="course-dropdown"></div>
      </div>
      <div id="topic-combobox">
        <input id="topic-search" type="text" placeholder="Classroom topic (optional)…" autocomplete="off" aria-label="Classroom topic">
        <span id="topic-chevron">▼</span>
        <div id="topic-dropdown"></div>
      </div>
      <span id="teacher-status"></span>
      <button id="btn-sync" class="btn-inline-ghost" onclick="onSyncClick()" hidden>⟳ Sync grades</button>
      <span id="sync-status"></span>
      <a href="getting-started.html" class="guide-link" title="How students' scores reach Classroom">How Grading Works →</a>
    </div>
  </div>
  <nav id="year-tabs" role="tablist" aria-label="Year group"></nav>
</header>

<div class="page">
  <aside class="sidebar" aria-label="Topics">
    <h2>Topics</h2>
    <ul id="toc"></ul>
  </aside>
  <main id="content">
    <div id="status">Loading activities…</div>
  </main>
</div>

<footer>
  Outwood Grange Academies Trust — CS Activities Hub &nbsp;|&nbsp;
  <a href="getting-started.html">How Grading Works</a>
  <div id="build-meta"></div>
</footer>

<script>
  // ── Google Classroom Config ──────────────────────────────
  const GOOGLE_CONFIG = {
    clientId: '379663437881-iukh6qnkq8jmqtqko3qog0n6ohuhemmq.apps.googleusercontent.com',
    // drive.metadata.readonly reads the score students' pages store on their work
    // evidence (appProperties); classroom.coursework.students writes it as the draft grade.
    scopes: 'https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.coursework.me https://www.googleapis.com/auth/classroom.coursework.students https://www.googleapis.com/auth/classroom.topics https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/userinfo.email'
  };

  let accessToken = null;
  // ── Redirect-based sign-in (no popup) ───────────────────
  // Navigates the whole page to Google's consent screen.
  // After sign-in Google redirects to /oauth-callback.html, which stores the
  // token in sessionStorage and bounces back here.

  function signInViaRedirect(opts) {
    const params = new URLSearchParams({
      client_id    : GOOGLE_CONFIG.clientId,
      redirect_uri : window.location.origin + '/interactive/oauth-callback.html',
      response_type: 'token',
      scope        : GOOGLE_CONFIG.scopes,
      prompt       : (opts && opts.prompt) || 'select_account',
    });
    try { sessionStorage.setItem('oga_return_url', window.location.href); } catch (_) {}
    window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
  }

  function requestPermission() { signInViaRedirect(); }

  // Called after successful sign-in (from redirect or session restore).
  async function onSignInSuccess(data) {
    accessToken = data.access_token;
    // Persist token for the rest of this browser session (survives page reloads).
    try { sessionStorage.setItem('oga_hub_token', JSON.stringify(data)); } catch (_) {}
    localStorage.setItem('oga_hub_autosignin', '1');
    document.getElementById('btnLogin').style.display = 'none';
    document.getElementById('teacher-status').textContent = '';
    document.getElementById('course-combobox').style.display = 'inline-block';
    document.body.classList.add('teacher-mode');

    fetchCourses();
    document.getElementById('btn-sync').hidden = false;
    syncGrades('changed');
  }

  // On page load: restore session if returning from redirect or if tab was reloaded.
  function checkPendingHubToken() {
    // 1. Returning from Google redirect — token left by oauth-callback.html
    let json = null;
    try { json = sessionStorage.getItem('oga_oauth_token'); } catch (_) {}
    if (json) {
      try { sessionStorage.removeItem('oga_oauth_token'); } catch (_) {}
      let data;
      try { data = JSON.parse(json); } catch (_) {}
      if (data && data.access_token && (!data.expires_at || data.expires_at > Date.now() + 30000)) {
        onSignInSuccess(data);
        return;
      }
    }
    // 2. Same browser session — token stored after previous sign-in this session
    let sessionJson = null;
    try { sessionJson = sessionStorage.getItem('oga_hub_token'); } catch (_) {}
    if (sessionJson) {
      let data;
      try { data = JSON.parse(sessionJson); } catch (_) {}
      if (data && data.access_token && data.expires_at > Date.now() + 30000) {
        onSignInSuccess(data);
        return;
      }
      try { sessionStorage.removeItem('oga_hub_token'); } catch (_) {}
    }
    // 3. Previously signed in on this device (different session) — try to reuse
    // the browser's existing Google session without showing a consent screen.
    let silentFailed = false;
    try { silentFailed = !!sessionStorage.getItem('oga_silent_failed'); } catch (_) {}
    if (silentFailed) {
      try { sessionStorage.removeItem('oga_silent_failed'); } catch (_) {}
    }

    if (localStorage.getItem('oga_hub_autosignin')) {
      const btn = document.getElementById('btnLogin');
      if (btn) btn.textContent = silentFailed ? 'Sign in again to Classroom' : 'Signing in...';
      if (!silentFailed) {
        document.getElementById('teacher-status').textContent = 'Checking your Google Classroom sign-in...';
        signInViaRedirect({ prompt: 'none' });
      }
    }
  }

  let allCourses = [];
  let selectedCourseId = '';
  let focusedIndex = -1;

  let allTopics = [];
  let selectedTopicId = '';
  let topicFocusedIndex = -1;

  async function fetchCourses() {
    const response = await fetch('https://classroom.googleapis.com/v1/courses?courseStates=ACTIVE', {
      headers: { 'Authorization': `Bearer ${accessToken}` }
    });
    const data = await response.json();
    allCourses = data.courses || [];
    initCombobox();
    initTopicCombobox();
  }

  async function fetchTopics(courseId) {
    const topicCombobox = document.getElementById('topic-combobox');
    const topicSearch   = document.getElementById('topic-search');
    topicSearch.value = '';
    selectedTopicId   = '';
    allTopics         = [];
    topicCombobox.style.display = 'none';
    try {
      const res  = await fetch(`https://classroom.googleapis.com/v1/courses/${courseId}/topics`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const data = await res.json();
      allTopics  = (data.topic || []).sort((a, b) => a.name.localeCompare(b.name));
      if (allTopics.length > 0) {
        topicCombobox.style.display = 'inline-block';
        const lastTopicId = localStorage.getItem(`oga_last_topic_${courseId}`);
        if (lastTopicId) {
          const lastTopic = allTopics.find(t => t.topicId === lastTopicId);
          if (lastTopic) {
            selectedTopicId = lastTopic.topicId;
            topicSearch.value = lastTopic.name;
          }
        }
      }
    } catch (e) {
      console.error('Failed to fetch topics:', e);
    }
  }

  function initTopicCombobox() {
    const searchEl = document.getElementById('topic-search');
    const dropdown = document.getElementById('topic-dropdown');

    searchEl.addEventListener('focus', () => {
      renderTopicDropdown(searchEl.value);
      dropdown.classList.add('open');
      topicFocusedIndex = -1;
    });
    searchEl.addEventListener('input', () => {
      selectedTopicId = '';
      renderTopicDropdown(searchEl.value);
      dropdown.classList.add('open');
      topicFocusedIndex = -1;
    });
    searchEl.addEventListener('keydown', e => {
      const items = dropdown.querySelectorAll('.course-option');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        topicFocusedIndex = Math.min(topicFocusedIndex + 1, items.length - 1);
        updateTopicFocus(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        topicFocusedIndex = Math.max(topicFocusedIndex - 1, 0);
        updateTopicFocus(items);
      } else if (e.key === 'Enter') {
        if (topicFocusedIndex >= 0 && items[topicFocusedIndex]) items[topicFocusedIndex].click();
      } else if (e.key === 'Escape') {
        dropdown.classList.remove('open');
      }
    });
    document.addEventListener('click', e => {
      if (!document.getElementById('topic-combobox').contains(e.target)) {
        dropdown.classList.remove('open');

      }

  }

  function renderTopicDropdown(query) {
    const dropdown = document.getElementById('topic-dropdown');
    const q = query.trim().toLowerCase();
    const filtered = q ? allTopics.filter(t => t.name.toLowerCase().includes(q)) : allTopics;

      dropdown.innerHTML = '<div class="course-no-match">No topics match</div>';
      return;
    }
    dropdown.innerHTML = filtered.map(t => {
      const sel = t.topicId === selectedTopicId ? ' selected' : '';
      return `<div class="course-option${sel}" data-id="${t.topicId}" data-name="${t.name.replace(/"/g,'&quot;')}">${t.name}</div>`;
    }).join('');
    dropdown.querySelectorAll('.course-option').forEach(el => {
      el.addEventListener('click', () => {
        selectedTopicId = el.dataset.id;
        document.getElementById('topic-search').value = el.dataset.name;

        topicFocusedIndex = -1;
        try { localStorage.setItem(`oga_last_topic_${selectedCourseId}`, selectedTopicId); } catch (_) {}
      });

  function updateTopicFocus(items) {
    items.forEach((el, i) => el.classList.toggle('focused', i === topicFocusedIndex));
    if (items[topicFocusedIndex]) items[topicFocusedIndex].scrollIntoView({ block: 'nearest' });
  }

  function initCombobox() {
    const searchEl = document.getElementById('course-search');
    const dropdown = document.getElementById('course-dropdown');

    renderDropdown('');

    // Reselect the class this teacher last assigned to on this device.
    let lastCourseId = '';
    try { lastCourseId = localStorage.getItem('oga_hub_last_course') || ''; } catch (_) {}
    const lastCourse = allCourses.find(c => c.id === lastCourseId);
    if (lastCourse && !selectedCourseId) {
      selectedCourseId = lastCourse.id;
      searchEl.value = lastCourse.name;
      refreshAssignButtons();
      fetchTopics(selectedCourseId);
    }

    searchEl.removeAttribute('readonly');
    searchEl.addEventListener('focus', () => {
      renderDropdown(searchEl.value);
      dropdown.classList.add('open');
      focusedIndex = -1;
    });

    searchEl.addEventListener('input', () => {
      selectedCourseId = '';
      refreshAssignButtons();
      renderDropdown(searchEl.value);
      dropdown.classList.add('open');
      focusedIndex = -1;
    });

    searchEl.addEventListener('keydown', e => {
      const items = dropdown.querySelectorAll('.course-option');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        focusedIndex = Math.min(focusedIndex + 1, items.length - 1);
        updateFocus(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        focusedIndex = Math.max(focusedIndex - 1, 0);
        updateFocus(items);
      } else if (e.key === 'Enter') {
        if (focusedIndex >= 0 && items[focusedIndex]) items[focusedIndex].click();
      } else if (e.key === 'Escape') {
        dropdown.classList.remove('open');
      }
    });

    document.addEventListener('click', e => {
      if (!document.getElementById('course-combobox').contains(e.target)) {
        dropdown.classList.remove('open');
        if (!selectedCourseId) searchEl.value = '';
      }
    });
  }

  function renderDropdown(query) {
    const dropdown = document.getElementById('course-dropdown');
    const q = query.trim().toLowerCase();
    const filtered = q ? allCourses.filter(c => c.name.toLowerCase().includes(q)) : allCourses;
    if (filtered.length === 0) {
      dropdown.innerHTML = '<div class="course-no-match">No classes match</div>';
      return;
    }
    dropdown.innerHTML = filtered.map(c => {
      const sel = c.id === selectedCourseId ? ' selected' : '';
      return `<div class="course-option${sel}" data-id="${c.id}" data-name="${c.name.replace(/"/g,'&quot;')}">${c.name}</div>`;
    }).join('');
    dropdown.querySelectorAll('.course-option').forEach(el => {
      el.addEventListener('click', () => {
        selectedCourseId = el.dataset.id;
        document.getElementById('course-search').value = el.dataset.name;
        dropdown.classList.remove('open');
        focusedIndex = -1;
        try { localStorage.setItem('oga_hub_last_course', selectedCourseId); } catch (_) {}
        refreshAssignButtons();
        fetchTopics(selectedCourseId);
      });

  function updateFocus(items) {
    items.forEach((el, i) => el.classList.toggle('focused', i === focusedIndex));
    if (items[focusedIndex]) items[focusedIndex].scrollIntoView({ block: 'nearest' });
  }

  // ── Assign modal helpers ─────────────────────────────────
  let _assignModalResolve = null;

  function showAssignModal(title, bodyHtml, actions) {
    document.getElementById('assign-modal-title').textContent = title;
    document.getElementById('assign-modal-body').innerHTML = bodyHtml;
    const actionsEl = document.getElementById('assign-modal-actions');
    actionsEl.innerHTML = '';
    (actions || [{ label: 'OK', primary: true, value: null }]).forEach(a => {
      const btn = document.createElement('button');
      btn.textContent = a.label;
      btn.className = a.primary ? 'assign-btn-primary' : 'assign-btn-secondary';
      btn.onclick = () => {
        document.getElementById('assign-modal-backdrop').classList.remove('open');
        if (_assignModalResolve) { _assignModalResolve(a.value); _assignModalResolve = null; }
      };
      actionsEl.appendChild(btn);
    });
    document.getElementById('assign-modal-backdrop').classList.add('open');
  }

  function assignModalConfirm(title, bodyHtml, actions) {
    return new Promise(resolve => {
      _assignModalResolve = resolve;
      showAssignModal(title, bodyHtml, actions);
    });
  }

  async function assignToClassroom(activityPath, title, btn) {
    const courseId = selectedCourseId;
    if (!courseId) {
      showAssignModal('⚠️ No class selected', 'Please select a class from the dropdown before assigning.');
      return;
    }

    if (btn) { btn.textContent = '⏳ Assigning…'; btn.disabled = true; }
    const restoreBtn = () => { if (btn) { btn.innerHTML = assignLabel(); btn.disabled = false; } };

    const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '') + activityPath;
    const activityUrl = `${baseUrl}?courseId=${courseId}`;

    const res = await fetch(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${accessToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        title: title,
        description: "Complete this interactive activity. Your grade will be automatically recorded.",
        materials: [{ link: { url: activityUrl } }],
        workType: "ASSIGNMENT",
        state: "PUBLISHED",
        maxPoints: 100,
        ...(selectedTopicId ? { topicId: selectedTopicId } : {})
      })
    });

    if (res.ok) {
      showAssignModal('✅ Assigned!', `"${title}" has been published to your class. Scores reach Classroom each time you open this hub (or click ⟳ Sync grades).`);
    } else {
      console.error('Assignment creation failed:', await res.text());
      showAssignModal('❌ Assignment failed', 'Could not create the assignment. Check the browser console for details.');
    }
    restoreBtn();
  }

  // ── Grade sync ───────────────────────────────────────────
  // classroom.js stores each student's score on their work evidence file
  // (appProperties.ogaScore). Classroom shares that file with the class's teachers and
  // only this OAuth client can read or change appProperties, so the hub reads the score
  // and writes draftGrade with the teacher's own token. Classroom allows that because
  // the hub created the assignment (associatedWithDeveloper). Grades are only raised.
  const AUTO_SYNC_DAYS = 90; // the fast sync never looks further back than this
  let syncRunning = false;

  // Retries rate-limit and transient server errors (429/500/503) with backoff,
  // so running more requests at once can't make a sync fail.
  async function googleFetch(url, options = {}) {
    for (let attempt = 0; ; attempt++) {
      const res = await fetch(url, { ...options, headers: { 'Authorization': `Bearer ${accessToken}`, ...options.headers } });
      if (![429, 500, 503].includes(res.status) || attempt === 3) return res;
      await new Promise(r => setTimeout(r, 1000 * 2 ** attempt + Math.random() * 500));
    }
  }

  async function googleGet(url) {
    const res = await googleFetch(url);
    if (!res.ok) throw new Error(`${res.status} ${await res.text().catch(() => '')}`);
    return res.json();
  }

  async function listAll(url, key) {
    let items = [], pageToken = '';
    do {
      const data = await googleGet(url + (url.includes('?') ? '&' : '?') + 'pageSize=100' +
        (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : ''));
      items = items.concat(data[key] || []);
      pageToken = data.nextPageToken;
    } while (pageToken);
    return items;
  }

  async function mapLimit(items, limit, fn) {
    let next = 0;
    const worker = async () => { while (next < items.length) await fn(items[next++]); };
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  }

  function readScore(appProperties) {
    const raw = appProperties?.ogaScore;
    return raw != null && Number.isFinite(Number(raw)) ? Math.min(100, Math.max(0, Number(raw))) : -1;
  }

  // Writes score as the draft grade unless the current one is already as high.
  // Returns 'raised', 'same' or 'failed'.
  async function raiseGrade(courseId, workId, subId, score, current) {
    if (score < 0 || score <= (current ?? -1)) return 'same';
    const res = await googleFetch(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork/${workId}/studentSubmissions/${subId}?updateMask=draftGrade`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ draftGrade: score })
    });
    if (res.ok) return 'raised';
    console.error('Grade sync: could not write grade', { courseId, workId, subId }, await res.text().catch(() => res.status));
    return 'failed';
  }

  // Fast path: one Drive search for evidence files changed since `since` (ms).
  // classroom.js tags each file with ogaSync=1 and its course/assignment/submission IDs.
  async function syncChanged(since, counts, statusEl) {
    const taught = new Set((await listAll('https://classroom.googleapis.com/v1/courses?teacherId=me&courseStates=ACTIVE&fields=courses(id),nextPageToken', 'courses')).map(c => c.id));
    const q = `appProperties has { key='ogaSync' and value='1' } and modifiedTime > '${new Date(since).toISOString()}' and trashed = false`;
    const files = await listAll('https://www.googleapis.com/drive/v3/files?corpora=user&fields=files(appProperties),nextPageToken&q=' + encodeURIComponent(q), 'files');

    // One entry per submission, keeping the best score if a student has several files.
    const subs = new Map();
    for (const f of files) {
      const p = f.appProperties || {};
      if (!taught.has(p.ogaCourse) || !p.ogaWork || !p.ogaSub) continue;
      const prev = subs.get(p.ogaSub);
      const score = readScore(p);
      if (!prev || score > prev.score) subs.set(p.ogaSub, { courseId: p.ogaCourse, workId: p.ogaWork, subId: p.ogaSub, score });
    }

    // One list call per assignment reads every current draft grade, instead of one
    // read per submission; then only the grades that go up are written.
    const byWork = new Map();
    for (const s of subs.values()) {
      const key = s.courseId + '/' + s.workId;
      if (!byWork.has(key)) byWork.set(key, []);
      byWork.get(key).push(s);
    }
    const toWrite = [];
    await mapLimit([...byWork.values()], 6, async group => {
      const { courseId, workId } = group[0];
      try {
        const current = new Map((await listAll(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork/${workId}/studentSubmissions?fields=studentSubmissions(id,draftGrade),nextPageToken`, 'studentSubmissions'))
          .map(sub => [sub.id, sub.draftGrade]));
        for (const s of group) {
          if (!current.has(s.subId)) { console.error('Grade sync: submission not found', s); counts.failed++; }
          else if (s.score > (current.get(s.subId) ?? -1)) toWrite.push(s);
          else counts.same++;
        }
      } catch (e) {
        console.error('Grade sync: could not read submissions', { courseId, workId }, e);
        counts.failed += group.length;
      }
    });

    let done = 0;
    await mapLimit(toWrite, 10, async s => {
      statusEl.textContent = `⟳ Syncing grades… ${++done}/${toWrite.length}`;
      counts[await raiseGrade(s.courseId, s.workId, s.subId, s.score)]++;
    });
  }

  // Full scan of one class: every hub-made assignment, every submission. Slower, but it
  // also finds evidence saved before the files carried ogaSync tags.
  async function syncClass(courseId, counts, statusEl) {
    const works = (await listAll(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork?fields=courseWork(id,associatedWithDeveloper),nextPageToken`, 'courseWork'))
      .filter(w => w.associatedWithDeveloper);
    // One Drive search reads the score of every tagged evidence file in this class;
    // only older, untagged files need a read each.
    const q = `appProperties has { key='ogaCourse' and value='${courseId}' } and trashed = false`;
    const tagged = new Map((await listAll('https://www.googleapis.com/drive/v3/files?corpora=user&fields=files(id,appProperties),nextPageToken&q=' + encodeURIComponent(q), 'files'))
      .map(f => [f.id, readScore(f.appProperties)]));
    let done = 0;
    statusEl.textContent = `⟳ Syncing grades… 0/${works.length} assignments`;
    await mapLimit(works, 4, async w => {
      const subs = await listAll(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork/${w.id}/studentSubmissions?fields=studentSubmissions(id,draftGrade,assignmentSubmission/attachments/driveFile/id),nextPageToken`, 'studentSubmissions');
      await mapLimit(subs.filter(s => (s.draftGrade ?? -1) < 100), 6, async s => {
        const ids = (s.assignmentSubmission?.attachments || []).map(a => a.driveFile?.id).filter(Boolean);
        const scores = await Promise.all(ids.map(id => tagged.has(id) ? tagged.get(id)
          : googleGet(`https://www.googleapis.com/drive/v3/files/${id}?fields=appProperties`).then(m => readScore(m.appProperties), () => -1)));
        counts[await raiseGrade(courseId, w.id, s.id, Math.max(-1, ...scores), s.draftGrade)]++;
      });
      statusEl.textContent = `⟳ Syncing grades… ${++done}/${works.length} assignments`;
    });
  }

  // Last successful fast sync, per Google account, so a shared computer doesn't skip
  // another teacher's changes.
  async function lastSyncKey() {
    const me = await googleGet('https://www.googleapis.com/oauth2/v3/userinfo').catch(() => ({}));
    return 'oga_hub_last_sync_' + (me.sub || 'unknown');
  }

  // mode: 'changed' (since the last sync, or AUTO_SYNC_DAYS on a new device),
  // 'recent' (AUTO_SYNC_DAYS) or { courseId } for a full scan of one class.
  async function syncGrades(mode) {
    if (syncRunning || !accessToken) return;
    syncRunning = true;
    const statusEl = document.getElementById('sync-status');
    const btn = document.getElementById('btn-sync');
    btn.disabled = true;
    const counts = { raised: 0, same: 0, failed: 0 };
    try {
      statusEl.textContent = '⟳ Checking for new scores…';
      if (mode && mode.courseId) {
        await syncClass(mode.courseId, counts, statusEl);
      } else {
        const startedAt = Date.now();
        const key = await lastSyncKey();
        let last = 0;
        try { last = Number(localStorage.getItem(key)) || 0; } catch (_) {}
        const floor = startedAt - AUTO_SYNC_DAYS * 86400000;
        // 10-minute overlap covers clock differences and saves landing mid-sync.
        const since = mode === 'changed' && last ? Math.max(floor, last - 10 * 60000) : floor;
        await syncChanged(since, counts, statusEl);
        // Only move the marker on when everything was written, so failures are retried.
        if (!counts.failed) { try { localStorage.setItem(key, String(startedAt)); } catch (_) {} }
      }
      statusEl.textContent = counts.raised ? `✅ ${counts.raised} grade${counts.raised === 1 ? '' : 's'} synced to Classroom` : '✅ Grades up to date';
      if (counts.failed) statusEl.textContent += ` · ⚠️ ${counts.failed} failed (see console)`;
    } catch (e) {
      console.error('Grade sync failed:', e);
      statusEl.textContent = '⚠️ Grade sync failed — see console';
    } finally {
      syncRunning = false;
      btn.disabled = false;
    }
  }

  // The button rechecks the last AUTO_SYNC_DAYS for every class, or fully scans the chosen class.
  function onSyncClick() {
    syncGrades(selectedCourseId ? { courseId: selectedCourseId } : 'recent');
  }

  // ── Topic colours ────────────────────────────────────────
  // Programming topics always get a shade of blue so they read as one family;
  // every other topic takes the next colour from a palette with no blues in it.
  const PROGRAMMING_TOPIC = /python|algorithm|oop|programming|pseudocode|sandbox/i;
  const PROGRAMMING_COLOURS = ['#38bdf8', '#60a5fa', '#7dd3fc', '#818cf8'];
  const OTHER_COLOURS = ['#00b4b4', '#f5a623', '#a855f7', '#2ecc71', '#e05555', '#f97316', '#ec4899', '#a3e635'];

  function topicColours(topics) {
    let p = 0, o = 0;
    const map = {};
    topics.forEach(t => {
      map[t] = PROGRAMMING_TOPIC.test(t)
        ? PROGRAMMING_COLOURS[p++ % PROGRAMMING_COLOURS.length]
        : OTHER_COLOURS[o++ % OTHER_COLOURS.length];
    });
    return map;
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function slugify(str) {
    return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function stars(n) {
    if (!n) return '';
    const filled = Math.min(n, 4);
    return `<span class="stars" aria-label="${filled} of 4 stars">${'★'.repeat(filled)}${'☆'.repeat(4 - filled)}</span>`;
  }

  // ── Assign button ────────────────────────────────────────
  const PLUS_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  function selectedCourseName() {
    const c = allCourses.find(c => c.id === selectedCourseId);
    return c ? c.name : '';
  }

  function assignLabel() {
    const name = selectedCourseName();
    return `${PLUS_ICON}<span>${name ? 'Assign to ' + esc(name) : 'Assign to Class'}</span>`;
  }

  // Called whenever the chosen class changes, so every card names it.
  function refreshAssignButtons() {
    const html = assignLabel();
    const name = selectedCourseName();
    document.querySelectorAll('.btn-assign:not(:disabled)').forEach(b => {
      b.innerHTML = html;
      b.title = name ? `Assign to ${name}` : 'Assign this activity to a Google Classroom class';
    });
  }

  async function onAssignClick(btn) {
    if (!accessToken) {
      const signIn = await assignModalConfirm(
        'Sign in to assign',
        'Sign in with your school Google account to assign activities to your Classroom classes.',
        [
          { label: 'Cancel',  primary: false, value: false },
          { label: 'Sign in', primary: true,  value: true  }
        ]
      );
      if (signIn) requestPermission();
      return;
    }
    if (!selectedCourseId) {
      // Point at the class picker rather than a modal — it's always on screen in the top bar.
      const search = document.getElementById('course-search');
      search.classList.add('attention');
      setTimeout(() => search.classList.remove('attention'), 2000);
      search.focus();
      return;
    }
    assignToClassroom(btn.dataset.path, btn.dataset.title, btn);
  }

  // ── Cards ────────────────────────────────────────────────
  function renderCard(a, withCrumb, lessonKey) {
    const isChallenge = /challenge/i.test(a.type || '');
    return `
      <div class="card">
        ${withCrumb ? `<div class="crumb">${esc(a._year)} › ${esc(a._topic)}</div>` : ''}
        ${lessonKey ? `<div class="lesson-tag"><b>Lesson ${esc(lessonKey)}</b>${esc(a.lesson || '')}</div>` : ''}
        <div class="card-title"><a href="${esc(a.path)}">${esc(a.title)}</a></div>
        <div class="card-desc" title="${esc(a.desc)}">${esc(a.desc)}</div>
        <div class="card-meta">
          <span class="pill${isChallenge ? ' challenge' : ''}">${esc(a.type)}</span>
          ${stars(a.stars)}
        </div>
        <button class="btn-assign" data-path="${esc(a.path)}" data-title="${esc(a.title)}">${assignLabel()}</button>
      </div>`;
  }

  // ── Build tree: year → topic → lesson key → {name, activities} ──
  let ALL = [];
  const tree = {};
  let years = [];
  let currentYear = null;
  let collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem('oga_hub_collapsed') || '{}'); } catch (_) {}

  function buildUI(activities) {
    ALL = activities.map(a => {
      const isYearGroup = /^Year\s+\d+$/i.test(a.year);
      return { ...a, _year: isYearGroup ? a.year : 'Other', _topic: isYearGroup ? a.topic : `${a.year} / ${a.topic}` };
    });
    ALL.forEach(a => {
      // lesson_suffix: the letter in a folder like L4R_Revision → key "4R".
      const lKey = a.lesson_num != null ? a.lesson_num + (a.lesson_suffix || '') : '__none__';
      const topics  = tree[a._year] || (tree[a._year] = {});
      const lessons = topics[a._topic] || (topics[a._topic] = {});
      (lessons[lKey] || (lessons[lKey] = { name: a.lesson || null, activities: [] })).activities.push(a);
    });

    years = Object.keys(tree).sort((a, b) => {
      if (a === 'Other') return 1;
      if (b === 'Other') return -1;
      const n = s => parseInt(s.replace(/\D+/, ''), 10);
      return n(a) - n(b);
    });

    const tabsEl = document.getElementById('year-tabs');
    tabsEl.innerHTML = years.map(y => {
      const n = ALL.filter(a => a._year === y).length;
      return `<button class="year-tab" role="tab" data-year="${slugify(y)}" aria-selected="false">${esc(y)}<span class="count">${n}</span></button>`;
    }).join('');
    tabsEl.querySelectorAll('.year-tab').forEach(t => t.addEventListener('click', () => switchYear(t.dataset.year, true)));

    // One delegated listener for every Assign button (cards are re-rendered on tab/search changes).
    document.getElementById('content').addEventListener('click', e => {
      const btn = e.target.closest('.btn-assign');
      if (btn) onAssignClick(btn);
    });

    let start = decodeURIComponent(location.hash.slice(1));
    if (!years.some(y => slugify(y) === start)) {
      try { start = localStorage.getItem('oga_hub_year') || ''; } catch (_) { start = ''; }
    }
    switchYear(start);
  }

  function sortTopics(year, topics) {
    return topics.sort((a, b) => {
      if (year === 'Other') {
        const aIsRs = /^rs\s*\//i.test(a);
        const bIsRs = /^rs\s*\//i.test(b);
        if (aIsRs !== bIsRs) return aIsRs ? 1 : -1;
      }
      return a.localeCompare(b, undefined, { numeric: true });
    });
  }

  function topicCount(lessons) {
    return Object.values(lessons).reduce((n, l) => n + l.activities.length, 0);
  }

  function switchYear(yearSlug, updateHash) {
    const year = years.find(y => slugify(y) === yearSlug) || years[0];
    currentYear = slugify(year);
    document.getElementById('search').value = '';
    document.querySelectorAll('.year-tab').forEach(t => {
      const on = t.dataset.year === currentYear;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on);
      if (on) t.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    try { localStorage.setItem('oga_hub_year', currentYear); } catch (_) {}
    if (updateHash) history.replaceState(null, '', '#' + currentYear);

    const topics  = sortTopics(year, Object.keys(tree[year]));
    const colours = topicColours(topics);

    document.getElementById('toc').innerHTML = topics.map(t => `
      <li><a href="#t-${slugify(t)}" data-topic="${slugify(t)}">
        <span class="dot" style="background:${colours[t]}"></span>${esc(t)}<span class="n">${topicCount(tree[year][t])}</span>
      </a></li>`).join('');

    document.getElementById('content').innerHTML = topics.map(t => {
      const lessonBuckets = tree[year][t];
      // Ungrouped first, then numerically ("4" before "4R" before "5")
      const lessonKeys = Object.keys(lessonBuckets).sort((a, b) => {
        if (a === '__none__') return -1;
        if (b === '__none__') return  1;
        return parseInt(a, 10) - parseInt(b, 10) || a.localeCompare(b);
      });
      const body = '<div class="cards">' + lessonKeys.map(lKey =>
        lessonBuckets[lKey].activities.map(a => renderCard(a, false, lKey === '__none__' ? null : lKey)).join('')
      ).join('') + '</div>';

      const id  = slugify(t);
      const key = currentYear + '/' + id;
      const n   = topicCount(lessonBuckets);
      return `
        <section class="topic" id="t-${id}" style="--tc:${colours[t]}">
          <button class="topic-head" aria-expanded="${!collapsed[key]}" data-key="${key}">
            <h3>${esc(t)}</h3><span class="n">${n} activit${n === 1 ? 'y' : 'ies'}</span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="topic-body">${body}</div>
        </section>`;
    }).join('');

    document.querySelectorAll('.topic-head').forEach(h => h.addEventListener('click', () => {
      const open = h.getAttribute('aria-expanded') === 'true';
      h.setAttribute('aria-expanded', String(!open));
      if (open) collapsed[h.dataset.key] = true; else delete collapsed[h.dataset.key];
      try { localStorage.setItem('oga_hub_collapsed', JSON.stringify(collapsed)); } catch (_) {}
    }));
    // Jumping to a collapsed topic from the sidebar opens it.
    document.querySelectorAll('#toc a').forEach(a => a.addEventListener('click', () => {
      const h = document.querySelector(`#t-${a.dataset.topic} .topic-head`);
      if (h && h.getAttribute('aria-expanded') === 'false') h.click();
    }));

    refreshAssignButtons();
    window.scrollTo({ top: 0, behavior: 'auto' });
    watchTopics();
  }

  // ── Scroll-spy: highlight the topic currently under the top bar ──
  let topicObserver = null;
  function watchTopics() {
    if (topicObserver) topicObserver.disconnect();
    if (!('IntersectionObserver' in window)) return;
    const barH = document.getElementById('topbar').offsetHeight;
    topicObserver = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const id = e.target.id.slice(2);
        document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('active', a.dataset.topic === id));
        const active = document.querySelector('#toc a.active');
        if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
    }, { rootMargin: `-${barH + 10}px 0px -70% 0px` });
    document.querySelectorAll('.topic').forEach(s => topicObserver.observe(s));
  }

  // Keep --bar-h in step with the sticky header (it grows when teacher status text wraps).
  function syncBarHeight() {
    document.documentElement.style.setProperty('--bar-h', document.getElementById('topbar').offsetHeight + 'px');
  }
  if ('ResizeObserver' in window) {
    new ResizeObserver(() => { syncBarHeight(); if (currentYear) watchTopics(); }).observe(document.getElementById('topbar'));
  }
  syncBarHeight();

  // ── Search across every year ─────────────────────────────
  const hubSearchEl = document.getElementById('search');
  hubSearchEl.addEventListener('input', () => {
    const q = hubSearchEl.value.trim().toLowerCase();
    if (!q) { switchYear(currentYear); return; }
    const hits = ALL.filter(a =>
      [a.title, a.desc, a._year, a._topic, a.lesson || ''].join(' ').toLowerCase().includes(q));
    document.querySelectorAll('.year-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    document.getElementById('toc').innerHTML = '';
    document.getElementById('content').innerHTML = hits.length
      ? `<div id="results"><h2>${hits.length} result${hits.length === 1 ? '' : 's'} for “${esc(hubSearchEl.value.trim())}”</h2>
           <div class="cards">${hits.map(a => renderCard(a, true)).join('')}</div></div>`
      : `<p class="empty">No activities match “${esc(hubSearchEl.value.trim())}”.</p>`;
  });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); hubSearchEl.focus(); }
    if (e.key === 'Escape' && document.activeElement === hubSearchEl && hubSearchEl.value) {
      hubSearchEl.value = '';
      hubSearchEl.dispatchEvent(new Event('input'));
    }
  });

  // ── Fetch and render ─────────────────────────────────────
  fetch('activities.json?v=' + Date.now())
    .then(r => {
      if (!r.ok) throw new Error('Could not load activities.json — ' + r.status);
      return r.json();
    })
    .then(activities => {
      document.getElementById('status').remove();
      buildUI(activities);
    })
    .catch(err => {
      const el = document.getElementById('status');
      if (!el) return;
      el.className = 'error';
      el.textContent = 'Could not load activities: ' + err.message;
    });

  // ── Fetch build metadata for footer ──────────────────────
  fetch('meta.json?v=' + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(meta => {
      if (!meta) return;
      document.getElementById('build-meta').textContent =
        `${meta.version} · ${meta.deployed} · ${meta.activities} activities · ${meta.sha}`;
    })
    .catch(() => {}); // Fail silently — meta.json may not exist on first deploy

  // Restore sign-in state on every page load (handles redirect return and tab reloads).
  checkPendingHubToken();
</script>

<div id="assign-modal-backdrop">
  <div id="assign-modal">
    <h2 id="assign-modal-title"></h2>
    <p id="assign-modal-body"></p>
    <div id="assign-modal-actions"></div>
  </div>
</div>

</body>
</html>
