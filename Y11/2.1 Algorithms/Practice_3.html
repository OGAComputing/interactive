<script type="module">
import { setupEditors, runPseudocode } from '../../pseudocode-editor.js';
import { preload } from '../../pyodide-runner.js';

const ACTIVITY_TITLE = 'Algorithm Practice 3';
const STORE_NS = location.pathname;

// ── Check helpers ──────────────────────────────────────────────
// The mocked input() echoes "prompt + value" into the output, so every
// behaviour check looks only at what the program printed itself.

// An echo line is "prompt + value", where the prompt may or may not end in a
// space (input("Password") gives "Passworddragon42"). A line only counts if
// the match doesn't split a number, so "Total: 50" isn't taken as a typed "0".
function isEcho(line, value) {
  const v = String(value);
  const l = line.trimEnd();
  if (!l.endsWith(v)) return false;
  const before = l.slice(0, l.length - v.length);
  return !(/^[\d.\-]/.test(v) && /[\d.]$/.test(before));
}

// Lines the program printed, with the input echo lines removed (in order).
function printed(run) {
  const lines = (run.output || '').split('\n');
  const keep = [];
  let k = 0;
  for (const line of lines) {
    const v = run.inputs[k];
    if (v !== undefined && isEcho(line, v)) {
      k++;
      continue;
    }
    keep.push(line);
  }
  return { lines: keep.filter(l => l.trim() !== ''), consumed: k };
}

const text  = run => printed(run).lines.join('\n').toLowerCase();
const nums  = s => (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
const ok    = run => !!run && run.ok;
const has   = (run, needle) => ok(run) && text(run).includes(needle.toLowerCase());
const count = (run, re) => ok(run) ? (text(run).match(new RegExp(re.source, 'g')) || []).length : 0;
const hasNum = (run, n) => ok(run) && nums(text(run)).some(x => Math.abs(x - n) < 1e-9);
const lastNum = run => { const a = nums(text(run)); return a.length ? a[a.length - 1] : NaN; };
// Some printed line containing `word` also contains the number n.
const lineNum = (run, word, n) => ok(run) &&
  printed(run).lines.some(l => l.toLowerCase().includes(word) && nums(l).some(x => Math.abs(x - n) < 1e-9));
// The numbers in `seq` appear one after another in a list of numbers.
const hasSeq = (list, seq) => list.some((_, i) => seq.every((v, j) => Math.abs(list[i + j] - v) < 1e-9));

const inputs     = src => (src.match(/\binput\s*\(/g) || []).length;
const hasIf      = src => /\bif\b/.test(src);
const hasLoop    = src => /\bfor\b|\bwhile\b|\bdo\b/.test(src);
const hasForLoop = src => /\bfor\s+\w+\s*=.*?\bto\b/.test(src);
const hasCondLoop = src => /\bwhile\b|\bdo\b.*?\buntil\b/.test(src);
const runningTotal = src => /\b(\w+)\s*=\s*(?:\1\s*\+|[\w.]+\s*\+\s*\1\b)/.test(src);

// ── Questions ──────────────────────────────────────────────────
// Each task: part, title, skills, goal, scenario (HTML), must [], tests [{inputs, expected}],
// criteria [{text, marks, check({src, runs})}]. `expected` only colours the test output.
const TASKS = [

  // ════════════ PART A — one skill at a time ════════════

  // ── Q1: Variables ──────────────────────────────────────────
  {
    part: 'A',
    title: 'Player Profile',
    skills: ['Variables'],
    goal: 'Store two pieces of information in variables and output them in one message.',
    scenario: `<p>A games console sets up a player profile. It asks the player for their <strong>username</strong> and the <strong>level</strong> they have reached, then displays a single message such as:</p>
      <p><code>Shadow99 is on level 12</code></p>`,
    must: [
      'Ask the user to enter their username',
      'Ask the user to enter their level',
      'Output one message that includes both the username and the level',
    ],
    tests: [
      { inputs: ['Shadow99', '12'], expected: ['shadow99', '12'] },
      { inputs: ['Pixel', '3'],     expected: ['pixel', '3'] },
    ],
    criteria: [
      { text: 'Inputs and stores the username', marks: 1,
        check: ({ src }) => inputs(src) >= 1 },
      { text: 'Inputs and stores the level', marks: 1,
        check: ({ src }) => inputs(src) >= 2 },
      { text: 'Outputs one message containing both the username and the level (tested: Shadow99 / 12 and Pixel / 3)', marks: 1,
        check: ({ runs }) => runs.every(r => ok(r) && printed(r).lines.some(l =>
          l.toLowerCase().includes(String(r.inputs[0]).toLowerCase()) && nums(l).includes(Number(r.inputs[1])))) },
    ],
  },

  // ── Q2: Calculations ───────────────────────────────────────
  {
    part: 'A',
    title: 'Pizza Party',
    skills: ['Calculations'],
    goal: 'Use arithmetic to work out how many pizza slices there are and how many each guest gets.',
    scenario: `<p>A party planner app works out how much pizza there is. Every pizza is cut into <strong>8 slices</strong>. The user enters the number of pizzas and the number of guests. The app displays the <strong>total number of slices</strong> and <strong>how many slices each guest gets</strong>.</p>
      <p>Example: 3 pizzas and 6 guests → 24 slices in total, 4 slices each.</p>`,
    must: [
      'Ask the user to enter the number of pizzas and the number of guests',
      'Calculate the total number of slices',
      'Calculate the number of slices each guest gets',
      'Output both results',
    ],
    tests: [
      { inputs: ['3', '6'],  expected: ['24', '4'] },
      { inputs: ['4', '16'], expected: ['32', '2'] },
    ],
    criteria: [
      { text: 'Inputs and stores the number of pizzas and the number of guests', marks: 1,
        check: ({ src }) => inputs(src) >= 2 },
      { text: 'Multiplies by 8 to calculate the total number of slices', marks: 1,
        check: ({ src }) => /\*\s*8\b|\b8\s*\*/.test(src) },
      { text: 'Outputs the correct total number of slices (3 pizzas → 24, 4 pizzas → 32)', marks: 1,
        check: ({ runs }) => hasNum(runs[0], 24) && hasNum(runs[1], 32) },
      { text: 'Outputs the correct number of slices per guest (24 ÷ 6 → 4, 32 ÷ 16 → 2)', marks: 1,
        check: ({ runs }) => hasNum(runs[0], 4) && hasNum(runs[1], 2) },
    ],
  },

  // ── Q3: Selection ──────────────────────────────────────────
  {
    part: 'A',
    title: 'Ride Height Check',
    skills: ['Selection'],
    goal: 'Decide whether a visitor is tall enough to go on a ride.',
    scenario: `<p>A theme park ride has a height restriction. Visitors must be <strong>120 cm or taller</strong> to ride. A member of staff enters the visitor's height in cm and the system displays whether they can ride.</p>`,
    must: [
      'Ask the user to enter the visitor\'s height in cm',
      'Output <code>Enjoy the ride</code> if the visitor is 120 cm or taller',
      'Output <code>Sorry, you are too short</code> otherwise',
    ],
    tests: [
      { inputs: ['150'], expected: 'enjoy' },
      { inputs: ['120'], expected: 'enjoy' },
      { inputs: ['119'], expected: 'too short' },
      { inputs: ['95'],  expected: 'too short' },
    ],
    criteria: [
      { text: 'Inputs and stores the height', marks: 1,
        check: ({ src }) => inputs(src) >= 1 },
      { text: 'Attempts to use selection (any if statement present)', marks: 1,
        check: ({ src }) => hasIf(src) },
      { text: 'Outputs "Enjoy the ride" for heights of 120 cm or more, and nothing about being too short (tested: 150, 120)', marks: 1,
        check: ({ runs }) => [0, 1].every(i => has(runs[i], 'enjoy') && !has(runs[i], 'short')) },
      { text: 'Outputs "Sorry, you are too short" for heights under 120 cm, and nothing about enjoying the ride (tested: 119, 95)', marks: 1,
        check: ({ runs }) => [2, 3].every(i => has(runs[i], 'too short') && !has(runs[i], 'enjoy')) },
    ],
  },

  // ── Q4: While loop (no totalling) ──────────────────────────
  {
    part: 'A',
    title: 'Password Gate',
    skills: ['While loop'],
    goal: 'Keep asking for a password until the correct one is entered.',
    scenario: `<p>A school laptop locker opens only when the correct password is entered. The password is <code>dragon42</code>. The locker keeps asking for the password until it is entered correctly, then displays <code>Access granted</code>.</p>`,
    must: [
      'Ask the user to enter the password',
      'Keep asking until the user enters <code>dragon42</code>',
      'Output <code>Access granted</code> once the correct password has been entered',
    ],
    tests: [
      { inputs: ['cat', 'letmein', 'dragon42'], expected: 'access granted' },
      { inputs: ['dragon42'],                   expected: 'access granted' },
      { inputs: ['Dragon42', 'dragon42'],       expected: 'access granted' },
    ],
    criteria: [
      { text: 'Inputs and stores the password', marks: 1,
        check: ({ src }) => inputs(src) >= 1 },
      { text: 'Attempts to use iteration (any loop present)', marks: 1,
        check: ({ src }) => hasLoop(src) },
      { text: 'Uses a condition-controlled loop (while or do…until)', marks: 1,
        check: ({ src }) => hasCondLoop(src) },
      { text: 'Keeps asking until "dragon42" is entered, then outputs "Access granted" once (tested: right first time, third time, and "Dragon42" with a capital D)', marks: 1,
        check: ({ runs }) => runs.every(r => count(r, /access granted/) === 1 && printed(r).consumed === r.inputs.length) },
    ],
  },

  // ── Q5: For loop ───────────────────────────────────────────
  {
    part: 'A',
    title: 'Rocket Countdown',
    skills: ['For loop'],
    goal: 'Count down from a number the user chooses, then launch.',
    scenario: `<p>A science club launches model rockets. The launch controller enters a starting number, and the system counts down <strong>from that number to 1</strong>, outputting each number on its own line. After the countdown it outputs <code>Lift off!</code></p>
      <p>Example: starting number 3 → <code>3</code>, <code>2</code>, <code>1</code>, <code>Lift off!</code></p>`,
    must: [
      'Ask the user to enter the starting number',
      'Use a count-controlled loop to output every number from the starting number down to 1',
      'Output <code>Lift off!</code> once, after the countdown',
    ],
    tests: [
      { inputs: ['5'], expected: ['5', '4', '3', '2', '1', 'lift off'] },
      { inputs: ['3'], expected: ['3', '2', '1', 'lift off'] },
    ],
    criteria: [
      { text: 'Inputs and stores the starting number', marks: 1,
        check: ({ src }) => inputs(src) >= 1 },
      { text: 'Attempts to use iteration (any loop present)', marks: 1,
        check: ({ src }) => hasLoop(src) },
      { text: 'Uses a count-controlled (for) loop', marks: 1,
        check: ({ src }) => hasForLoop(src) },
      { text: 'Outputs every number from the starting number down to 1, in order, without 0 (tested: 5 and 3)', marks: 1,
        check: ({ runs }) =>
          ok(runs[0]) && ok(runs[1]) &&
          hasSeq(nums(text(runs[0])), [5, 4, 3, 2, 1]) && !hasNum(runs[0], 0) && !hasNum(runs[0], 6) &&
          hasSeq(nums(text(runs[1])), [3, 2, 1])       && !hasNum(runs[1], 0) && !hasNum(runs[1], 4) },
      { text: 'Outputs "Lift off!" exactly once, after the last number', marks: 1,
        check: ({ runs }) => runs.every(r => {
          const lines = printed(r).lines;
          return ok(r) && count(r, /lift off/) === 1 && /lift off/i.test(lines[lines.length - 1] || '');
        }) },
    ],
  },

  // ── Q6: Loop with totalling ────────────────────────────────
  {
    part: 'A',
    title: 'Step Counter',
    skills: ['Loop with totalling'],
    goal: 'Add up a number of daily step counts to find the total.',
    scenario: `<p>A fitness tracker app works out how many steps a user has walked in total. The user first enters <strong>how many days</strong> they want to add up. The app then asks for the <strong>number of steps walked on each day</strong>. After all the days have been entered, it outputs the <strong>total number of steps</strong>.</p>`,
    must: [
      'Ask the user how many days they want to enter',
      'Ask for the number of steps for each of those days',
      'Add each day\'s steps to a running total',
      'Output the total after all the days have been entered',
    ],
    // A trailing 999 is only read if the loop runs one time too many.
    tests: [
      { inputs: ['3', '4000', '2500', '6000', '999'], expected: '12500' },
      { inputs: ['2', '800', '700', '999'],           expected: '1500' },
    ],
    criteria: [
      { text: 'Inputs the number of days and the steps for each day', marks: 1,
        check: ({ src }) => inputs(src) >= 2 },
      { text: 'Attempts to use iteration (any loop present)', marks: 1,
        check: ({ src }) => hasLoop(src) },
      { text: 'Adds each day\'s steps to a running total', marks: 1,
        check: ({ src }) => runningTotal(src) },
      { text: 'Outputs the correct total after the loop (3 days: 4000 + 2500 + 6000 → 12500)', marks: 1,
        check: ({ runs }) => ok(runs[0]) && lastNum(runs[0]) === 12500 },
      { text: 'Loop repeats the number of times the user entered, not a fixed number (2 days: 800 + 700 → 1500)', marks: 1,
        check: ({ runs }) => ok(runs[1]) && lastNum(runs[1]) === 1500 },
    ],
  },

  // ════════════ PART B — combining skills ════════════

  // ── Q7: Calculations + selection ───────────────────────────
  {
    part: 'B',
    title: 'School Trip Minibuses',
    skills: ['Variables', 'Calculations', 'Selection'],
    goal: 'Work out how many minibuses can be filled, how many students are left over, and whether another minibus is needed.',
    scenario: `<p>A school is booking minibuses for a trip. Each minibus holds exactly <strong>16 students</strong>. The trip organiser enters the number of students going. The system outputs:</p>
      <ul>
        <li>how many minibuses can be <strong>completely filled</strong></li>
        <li>how many students are <strong>left over</strong></li>
        <li><code>Extra minibus needed</code> if any students are left over, or <code>All minibuses full</code> if none are</li>
      </ul>
      <p>Example: 50 students → 3 full minibuses, 2 students left over, <code>Extra minibus needed</code></p>`,
    must: [
      'Ask the user to enter the number of students',
      'Calculate and output the number of completely full minibuses',
      'Calculate and output the number of students left over',
      'Output the correct message about an extra minibus',
    ],
    tests: [
      { inputs: ['50'], expected: ['3', '2', 'extra minibus'] },
      { inputs: ['32'], expected: ['2', '0', 'all minibuses full'] },
      { inputs: ['70'], expected: ['4', '6', 'extra minibus'] },
    ],
    criteria: [
      { text: 'Inputs and stores the number of students', marks: 1,
        check: ({ src }) => inputs(src) >= 1 },
      { text: 'Outputs the correct number of full minibuses (50 → 3, 32 → 2, 70 → 4)', marks: 1,
        check: ({ runs }) => hasNum(runs[0], 3) && hasNum(runs[1], 2) && hasNum(runs[2], 4) },
      { text: 'Outputs the correct number of students left over (50 → 2, 32 → 0, 70 → 6)', marks: 1,
        check: ({ runs }) => hasNum(runs[0], 2) && hasNum(runs[1], 0) && hasNum(runs[2], 6) },
      { text: 'Attempts to use selection (any if statement present)', marks: 1,
        check: ({ src }) => hasIf(src) },
      { text: 'Outputs "Extra minibus needed" when students are left over (tested: 50, 70)', marks: 1,
        check: ({ runs }) => [0, 2].every(i => has(runs[i], 'extra minibus') && !has(runs[i], 'all minibuses full')) },
      { text: 'Outputs "All minibuses full" when no students are left over (tested: 32)', marks: 1,

// ── State ──────────────────────────────────────────────────────
const taskEarned = new Array(TASK_COUNT).fill(0);

// Lower-case the source and blank out comments and string literals, so words
// inside messages (e.g. "Thanks for playing") don't count as keywords.
function normSrc(raw) {
  return raw
    .replace(/\/\/[^\n]*/g, ' ')
    .replace(/"[^"\n]*"|'[^'\n]*'/g, '""')
    .replace(/\s+/g, ' ')
    .toLowerCase()
    .trim();
}

// ── Editor setup ───────────────────────────────────────────────
for (let i = 0; i < TASK_COUNT; i++) {
  try {
    const saved = localStorage.getItem(STORE_NS + ':e' + i);
    if (saved !== null) document.getElementById('editor-' + i).value = saved;
  } catch (_) {}
}
setupEditors('.pseudocode-textarea');
preload();

// ── Restore mark scheme state ──────────────────────────────────
for (let i = 0; i < TASK_COUNT; i++) {
  try {
    const raw = localStorage.getItem(STORE_NS + ':ms' + i);
    if (!raw) continue;
    const { earned, passed } = JSON.parse(raw);
    if (passed.length !== TASKS[i].criteria.length) continue;
    taskEarned[i] = earned;
    applyMarkscheme(i, passed, earned, TASKS[i].maxMarks);
    updateTabState(i, earned, TASKS[i].maxMarks);
  } catch (_) {}
}

document.getElementById('tab-bar').addEventListener('click', e => {

  if (!tab) return;
  const idx = +tab.dataset.idx;
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));

// ── Run button wiring ──────────────────────────────────────────
for (let idx = 0; idx < TASK_COUNT; idx++) {
  const runBtn   = document.getElementById('run-'        + idx);
  const clearBtn = document.getElementById('clear-'      + idx);
  const statusEl = document.getElementById('run-status-' + idx);
  const editorEl = document.getElementById('editor-'     + idx);

  runBtn.addEventListener('click', () => handleRun(idx, editorEl, runBtn, statusEl));

  clearBtn.addEventListener('click', () => {
    editorEl.value = '';
    editorEl.dispatchEvent(new Event('input'));
    setAnswerState(editorEl, true);
    resetMarkscheme(idx);
    try {
      localStorage.removeItem(STORE_NS + ':e' + idx);
      localStorage.removeItem(STORE_NS + ':ms' + idx);
    } catch (_) {}
  });

  let saveTimer;
  editorEl.addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_NS + ':e' + idx, editorEl.value); } catch (_) {}
    }, 500);
  });
}

async function handleRun(idx, editorEl, runBtn, statusEl) {
  const task = TASKS[idx];
  runBtn.disabled = true;
  statusEl.textContent = 'Running…';

  const runs = [];
  for (const test of task.tests) {
    const r = await runPseudocode(editorEl, { inputs: test.inputs });
    runs.push({ inputs: test.inputs, output: r.output || '', ok: r.ok });
  }

  statusEl.textContent = '';
  runBtn.disabled = false;

  _renderTestOutput(editorEl, task.tests, runs);

  if (!runs[0].ok && !runs[0].output) {
    window.ActivityUI?.showToast('Fix the syntax error shown in the editor before checking marks.', 'warn');
  }

  const src = normSrc(editorEl.value);
  let earned = 0;
  const passed = task.criteria.map(c => {
    let result = false;
    try { result = !!c.check({ src, runs }); } catch (_) { result = false; }
    if (result) earned += c.marks;
    return result;
  });

  applyMarkscheme(idx, passed, earned, task.maxMarks);
  setAnswerState(editorEl, earned === task.maxMarks);
  try { localStorage.setItem(STORE_NS + ':ms' + idx, JSON.stringify({ earned, passed })); } catch (_) {}

  taskEarned[idx] = earned;
  updateTabState(idx, earned, task.maxMarks);
  const pct = updateProgress();
  window.ActivityUI?.setScore?.(pct);
  window.Classroom?.submitGrade(pct, ACTIVITY_TITLE);

  if (taskEarned.every((e, i) => e === TASKS[i].maxMarks)) allComplete();
}

// ── Per-test coloured output ───────────────────────────────────
// Passing tests show teal; failing tests (wrong output or error) show red.
function _renderTestOutput(editorEl, tests, runs) {
  const outputPanel = editorEl.closest('.editor-wrap')?.querySelector('.output-panel');
  if (!outputPanel) return;
  outputPanel.classList.remove('error');
  const content = outputPanel.querySelector('.output-content');
  const inputRow = outputPanel.querySelector('.output-input-row');
  if (inputRow) inputRow.hidden = true;
  if (!content) return;

  const SEP = '─'.repeat(44);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  content.innerHTML = runs.map((run, i) => {
    const test = tests[i];
    const label = run.inputs.length === 1
      ? `input: "${run.inputs[0]}"`
      : `inputs: ${run.inputs.map(v => `"${v}"`).join(', ')}`;

    let testPassed;
    if (!run.ok) {
      testPassed = false;
    } else if (test.expected !== undefined) {
      const out = text(run);
      const needles = Array.isArray(test.expected) ? test.expected : [test.expected];
      testPassed = needles.every(n => /^-?\d+(\.\d+)?$/.test(n) ? hasNum(run, Number(n)) : out.includes(n.toLowerCase()));
    } else {
      testPassed = true;
    }

    const out = run.ok ? (run.output || '(no output)') : `⚠ ${run.output || 'Error — check syntax'}`;
    const color = testPassed ? '#5eead4' : '#ff6b6b';
    return `<span style="color:${color}">${esc(`Test ${i + 1}  (${label})\n${SEP}\n${out}`)}</span>`;
  }).join('\n\n');
}

// ── Mark scheme DOM updates ────────────────────────────────────
function applyMarkscheme(idx, passed, earned, maxMarks) {
  document.getElementById('ms-list-' + idx).querySelectorAll('.ms-row').forEach((row, i) => {
    row.classList.remove('pass', 'fail');
    row.classList.add(passed[i] ? 'pass' : 'fail');
    row.querySelector('.ms-tick').textContent = passed[i] ? '✓' : '✗';
  });
  const scoreEl = document.getElementById('ms-score-' + idx);
  scoreEl.textContent = earned + ' / ' + plural(maxMarks);
  scoreEl.classList.toggle('full', earned === maxMarks);
}

function resetMarkscheme(idx) {
  document.getElementById('ms-list-' + idx).querySelectorAll('.ms-row').forEach(row => {
    row.classList.remove('pass', 'fail');
    row.querySelector('.ms-tick').textContent = '○';
  });
  const scoreEl = document.getElementById('ms-score-' + idx);
  scoreEl.textContent = '— / ' + plural(TASKS[idx].maxMarks);
  scoreEl.classList.remove('full');
}

// ── Tab state ──────────────────────────────────────────────────
// Code tasks are always gold when complete; a partly-marked question gets a gold outline.
function updateTabState(idx, earned, maxMarks) {
  const tab = document.querySelector('.tab-btn[data-idx="' + idx + '"]');
  if (!tab) return;
  tab.classList.toggle('done-gold', earned === maxMarks);
  tab.classList.toggle('partial', earned > 0 && earned < maxMarks);
}

// ── Progress bar ───────────────────────────────────────────────
function updateProgress() {
  const totalEarned = taskEarned.reduce((s, v) => s + v, 0);
  const pct = Math.round(totalEarned / TOTAL_MARKS * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent  = totalEarned + ' / ' + TOTAL_MARKS;
  return pct;
}

// ── All tasks complete ─────────────────────────────────────────
function allComplete() {
  document.getElementById('done-banner').classList.add('show', 'gold');
  document.getElementById('glow-overlay')?.classList.add('gold', 'show');
  window.ActivityUI?.launchCelebration({ percent: 100 });
}

// Highlight the checker block that needs attention.
function setAnswerState(target, isOk) {
  const block = target?.closest('.code-checker');
  if (block) block.classList.toggle('is-wrong', !isOk);
}

window.showToast = (msg, type = '') => window.ActivityUI?.showToast(msg, type);
</script>
