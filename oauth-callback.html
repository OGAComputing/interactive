<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in…</title>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center;
         min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif;
         background: #0f172a; color: #94a3b8; font-size: 1rem; }
  .msg { text-align: center; }
  .spinner { width: 36px; height: 36px; border: 3px solid #334155;
             border-top-color: #3b82f6; border-radius: 50%;
             animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="msg">
  <div class="spinner"></div>
  <p id="status">Completing sign-in…</p>
</div>
<script>
(function () {
  // Google redirects here with the OAuth response in the URL fragment after sign-in.
  // Parse the token, store it for the originating page to pick up, then navigate back.
  // Errors normally arrive in the fragment too, but fall back to the query string.
  const params    = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  const token     = params.get('access_token');
  const expiresIn = parseInt(params.get('expires_in') || '3600', 10);
  const scope     = params.get('scope') || '';
  const error     = params.get('error');

  // Same log and format as classroom.js's authLog(), so the activity's
  // "Sign-in log" button shows this step too. Never log the token itself.
  function authLog(message) {
    try {
      const log = JSON.parse(localStorage.getItem('oga_auth_log') || '[]');
      log.push({ t: Date.now(), p: 'oauth-callback', m: String(message) });
      localStorage.setItem('oga_auth_log', JSON.stringify(log.slice(-80)));
    } catch (_) {}
  }

  let returnUrl = null;
  let mode = null; // 'silent' (prompt=none) or 'interactive'; null from older cached classroom.js
  try {
    returnUrl = sessionStorage.getItem('oga_return_url');
    mode = sessionStorage.getItem('oga_auth_mode');
    sessionStorage.removeItem('oga_auth_mode');
  } catch (_) {}

  if (error) {
    const desc = params.get('error_description') || '';
    authLog(`← Back from Google with ERROR: ${error}${desc ? ' — ' + desc : ''} (${mode || 'unknown'} sign-in)`);
    if (returnUrl) {
      // Always set oga_silent_failed so the page doesn't immediately retry
      // silent auth (which would bounce straight back here in a loop).
      try { sessionStorage.setItem('oga_silent_failed', '1'); } catch (_) {}
      // A failed silent attempt is expected (the page just shows the sign-in
      // button). A failed interactive attempt is a real problem: pass it back so
      // the page can show it instead of looking as if nothing happened.
      if (mode === 'interactive') {
        try {
          sessionStorage.setItem('oga_auth_error', JSON.stringify({
            error       : error,
            description : params.get('error_description') || ''
          }));
        } catch (_) {}
      }
      try { sessionStorage.removeItem('oga_return_url'); } catch (_) {}
      location.replace(returnUrl);
    } else {
      location.replace('./');
    }
    return;
  }

  if (!token) {
    authLog('← Back from Google with no token and no error (URL had: ' +
      (location.hash ? 'fragment' : 'no fragment') + ', ' + (location.search ? 'query' : 'no query') + ')');
    // As with an error: stop the page retrying silent sign-in straight back here.
    try {
      sessionStorage.setItem('oga_silent_failed', '1');
      sessionStorage.removeItem('oga_return_url');
    } catch (_) {}
    location.replace(returnUrl || './');
    return;
  }

  authLog(`← Back from Google with a token (${expiresIn}s); permissions: ` +
    (scope.split(' ').filter(Boolean).map(s => s.replace('https://www.googleapis.com/auth/', '')).join(', ') || 'none listed'));

  if (!returnUrl) {
    // Usually an old callback URL reopened from browser history (the address bar
    // autocompletes to it, since every sign-in visits it), so there's no page to
    // return to and the token may be stale. Drop it and go to the hub instead of
    // leaving the student on a spinner.
    authLog('No return page saved in this tab (old callback URL from history, or sign-in finished in a different tab) — going to the hub');
    location.replace('./');
    return;
  }

  try {
    sessionStorage.setItem('oga_oauth_token', JSON.stringify({
      access_token : token,
      scope        : scope,
      expires_at   : Date.now() + expiresIn * 1000
    }));
    sessionStorage.removeItem('oga_return_url');
  } catch (_) {}

  location.replace(returnUrl);
}());
</script>
</body>
</html>
