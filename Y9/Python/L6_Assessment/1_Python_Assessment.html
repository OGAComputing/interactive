<!DOCTYPE html>
<html lang="en">
<head>
<!-- ACTIVITY
title:  Python Assessment — Systems Check
type:   Assessment
stars:  4
desc:   Station Zero, Chapter 6: the end-of-unit assessment for Lessons 1–5 (errors, casting, elif, while, for and turtle, functions), then one short program to write.
color:  teal
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Systems Check — Year 9 Python Assessment</title>
<link rel="stylesheet" href="../../../shared.css">
<script src="../../../theme-toggle.js"></script>

<style>
  /* ════════════════════════════════════════════════════════════════════
     YEAR 9 THEME — Station Zero "hull" palette, as in the chapters (L1–L5): near-black hull,
     HUD teal accent, phosphor green for the station's own screens. Dark by default; the header
     switch (theme-toggle.js) turns on the light "day shift" palette (LIGHT MODE block below).
     Tokens are declared on body[data-year] as well as :root so they beat shared.css's Y9
     palette, which classroom.js switches on from the URL path. Chapter 6 tint: plain black.
     ════════════════════════════════════════════════════════════════════ */
  :root, body[data-year] {
    color-scheme: dark;
    --canvas:       #07090b;   /* page background — Systems Check: plain black */
    --chrome:       #030506;   /* header */
    --card:         #11161b;
    --card-raised:  #182027;
    --card-hover:   #1f2932;
    --line:         #2a3540;
    --line-strong:  #5b6b7a;   /* input / option borders — 3:1 on --card */

    --cobalt:       #0f766e;   /* button fill — white text 5.5:1 */
    --cobalt-dark:  #0d5f59;
    --cobalt-text:  #5eead4;   /* accent as text — 11:1 on --card */
    --cobalt-tint:  rgba(45,212,191,0.13);

    --crt:          #5cff8f;
    --crt-faint:    #1f7a40;
    --crt-glow:     0 0 6px rgba(92,255,143,0.55);
    --hud-font:     'Cascadia Code', 'Consolas', 'SFMono-Regular', 'Courier New', monospace;

    --text:         #e3e8ec;   /* 14:1 on --card */
    --heading:      #ffffff;
    --muted:        #9aa8b5;   /* 7:1 on --card */
    --amber:        #f5a524;
    --amber-bg:     rgba(245,165,36,0.12);
    --amber-text:   #fcd28a;
    --green:        #22c55e;
    --green-text:   #6ee7a0;
    --green-bg:     rgba(34,197,94,0.12);
    --red:          #f0506e;
    --red-text:     #ff9aad;
    --red-bg:       rgba(240,80,110,0.12);
    --gold:         #f59e0b;
    --gold-text:    #fcd34d;
    --gold-bg:      rgba(245,158,11,0.12);
    --code-bg:      #05070a;
    --code-text:    #d8dee9;
    --code-num:     #6b7c8c;
    --code-str:     #a7f3a0;
    --code-fn:      #90e0ef;
    --code-kw:      #ffb4a2;

    /* shared.css / activity-ui.js tokens */
    --bg:           var(--canvas);
    --accent:       var(--cobalt);
    --accent-dark:  var(--cobalt-dark);
    --accent-light: var(--cobalt-text);
    --accent-rgb:   15,118,110;
    --surface:      var(--chrome);
    --surface-mid:  #1d3026;
    --text-inv:     #ffffff;
    --green-dark:   #15803d;
    --amber-dark:   #b45309;
    --font-body:    'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-head:    'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-mono:    'Cascadia Code', 'Consolas', 'SFMono-Regular', 'Courier New', monospace;
    --focus-ring:   0 0 0 3px rgba(94,234,212,0.55);
  }
  body {
    font-family: var(--font-body); background-color: var(--canvas); color: var(--text); line-height: 1.5;
    background-image:
      radial-gradient(ellipse 80% 45% at 50% 0%, rgba(74,222,128,0.08), transparent 70%),
      radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1.2px);
    background-size: auto, 22px 22px;
  }
  :focus-visible { outline: none; box-shadow: var(--focus-ring); }
  strong { color: var(--heading); }
  code { font-family: var(--font-mono); background: var(--card-raised); color: var(--code-text); padding: 0 4px; border-radius: 3px; font-size: 0.92em; font-variant-ligatures: none; }

  /* ── Header: a dark station console in both modes ─────── */
  .header { background: var(--chrome); padding: 18px 28px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .header::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--crt-faint), var(--cobalt), var(--crt-faint)); }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .header-title { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; color: #ffffff; }
  .header-sub { font-size: 0.82rem; color: #9aa8b5; margin-top: 3px; }
  .sz-strip { font-family: var(--hud-font); font-size: 0.74rem; letter-spacing: .06em; color: var(--crt); text-shadow: var(--crt-glow); margin-top: 6px; }
  .py-status { font-family: var(--hud-font); font-size: 0.72rem; letter-spacing: .05em; color: #9aa8b5; background: #0b1013; border: 1px solid #2a3540; padding: 4px 10px; border-radius: 999px; }
  .py-status.ready { color: var(--crt); border-color: var(--crt-faint); }
  .score-row { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .score-pill { background: #0b1013; border: 1px solid var(--cobalt); border-radius: 20px; padding: 4px 16px; font-size: 0.85rem; font-weight: 700; color: #ffffff; }
  .bonus-pill { font-size: 0.8rem; font-weight: 700; color: #fcd34d; }
  .score-bar-wrap { flex: 1; min-width: 120px; max-width: 260px; height: 8px; background: #1b2329; border-radius: 4px; overflow: hidden; }
  .score-bar { height: 100%; background: var(--cobalt); border-radius: 4px; width: 0%; transition: width .5s ease; }
  /* The header shows the score; activity-ui's corner badge says "Go for Gold", which can't apply to one-try answers. */
  #activity-ui-score { display: none !important; }
  /* The light-mode switch: a console key, as in the chapters. */
  html[data-theme] .header .theme-toggle {
    min-height: 36px; padding: 0 0.85rem; border-radius: 6px; background: #020704; color: var(--crt);
    border: 1px solid var(--crt-faint); font: 400 0.74rem/1 var(--hud-font); letter-spacing: 0.1em;
    text-transform: uppercase; text-shadow: var(--crt-glow); margin-left: 0;
  }
  html[data-theme] .header .theme-toggle:hover { background: rgba(92,255,143,0.08); border-color: var(--crt); }
  html[data-theme="light"] .header .theme-toggle { background: var(--crt); color: #021006; border-color: var(--crt); text-shadow: none; }

  #glow-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0; transition: opacity 1.8s ease; }
  #glow-overlay.gold  { background: radial-gradient(ellipse at 50% 55%, rgba(251,191,36,.20) 0%, transparent 65%); }
  #glow-overlay.green { background: radial-gradient(ellipse at 50% 55%, rgba(16,185,129,.18) 0%, transparent 65%); }
  #glow-overlay.show  { opacity: 1; }

  /* ── Start tab: how it works ─────────────────────────── */
  .how-list { list-style: none; display: grid; gap: 10px; margin: 6px 0 0; }
  .how-list li { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--cobalt); border-radius: 0 8px 8px 0; padding: 10px 14px; line-height: 1.6; font-size: 0.95rem; }

  /* ── Tabs ────────────────────────────────────────────── */
  .tab-bar { display: flex; background: var(--chrome); padding: 0 20px; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-top: 14px; }
  .tab { padding: 10px 9px 9px; border: none; background: transparent; color: #9aa8b5; font-family: var(--font-body); font-size: 0.8rem; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; user-select: none; }
  .tab:hover { color: #ffffff; }
  .tab.active { color: #ffffff; border-bottom-color: var(--cobalt-text); }
  .tab .count { font-size: 0.72rem; font-weight: 700; background: rgba(255,255,255,.1); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
  .tab.done { color: #6ee7a0; }
  .tab.done .count { background: rgba(34,197,94,.25); }
  .tab.partial { color: #fcd34d; }
  .tab.partial .count { background: rgba(252,211,77,.2); }
  .tab.skipped { color: #ff9aad; }
  .tab.skipped .count { background: #dc2626; color: #fff; }

  /* ── Panels ──────────────────────────────────────────── */
  .panel { display: none; padding: 24px 28px 64px; max-width: 920px; margin: 0 auto; position: relative; z-index: 1; }
  .panel.active { display: block; animation: ac-fade-in .25s ease; }
  .task-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .task-badge { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; color: #fff; background: var(--cobalt); flex-shrink: 0; }
  .task-badge.ext { background: var(--card-raised); color: var(--gold-text); border: 1px solid var(--gold); border-radius: 10px; }
  .task-title { font-family: var(--font-head); font-size: 1.25rem; font-weight: 700; color: var(--heading); }
  .task-sub { font-size: 0.82rem; color: var(--muted); }
  .goal { display: block; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--cobalt); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.92rem; font-weight: 600; color: var(--text); margin-bottom: 16px; line-height: 1.5; }
  .panel p { line-height: 1.55; }
  .next-row { display: flex; justify-content: flex-end; margin-top: 18px; }

  /* Station Zero framing: one line per section, a station readout */
  .sz-line { font-family: var(--hud-font); font-size: 0.8rem; color: var(--crt); background: #030a05; border: 1px solid var(--crt-faint); border-radius: 6px; padding: 6px 10px; margin: -4px 0 14px; text-shadow: 0 0 4px rgba(92,255,143,.35); }
  .sz-room { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-right: 6px; color: #b6ffcc; }

  /* ── Question cards ──────────────────────────────────── */
  .question-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 14px 0; background: var(--card); }
  .question-card.is-wrong { border-color: rgba(240,80,110,.6); background: linear-gradient(var(--red-bg), var(--red-bg)), var(--card); }
  .question-card.is-right { border-color: rgba(34,197,94,.6); background: linear-gradient(var(--green-bg), var(--green-bg)), var(--card); }
  .question-card.is-partial { border-color: rgba(245,165,36,.6); background: linear-gradient(var(--amber-bg), var(--amber-bg)), var(--card); }
  .q-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .q-no { font-size: 0.74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .q-marks { font-size: 0.72rem; font-weight: 700; background: var(--card-raised); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; }
  .q-label { font-weight: 700; color: var(--heading); line-height: 1.5; display: block; margin-bottom: 6px; }
  .feedback { min-height: 1.2em; font-size: 0.9rem; font-weight: 600; margin-top: 10px; line-height: 1.5; }
  .feedback.correct { color: var(--green-text); }
  .feedback.wrong   { color: var(--red-text); }
  .feedback.partial { color: var(--amber-text); }
  .feedback.info    { color: var(--muted); }
  .answer-hidden .opts, .answer-hidden .branch-row, .answer-hidden .why { display: none; }
  .hide-note { font-weight: 400; color: var(--muted); }
  .why { margin-top: 10px; padding: 9px 12px; border-radius: 8px; background: var(--card-raised); border: 1px solid var(--line); font-size: 0.88rem; line-height: 1.5; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .ac-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* Static code listing */
  .listing { background: var(--code-bg); color: var(--code-text); border: 1px solid var(--line); font-family: var(--font-mono); font-variant-ligatures: none; font-size: 0.92rem; border-radius: 8px; padding: 10px 0; margin: 10px 0; overflow-x: auto; }
  .listing .ln { display: flex; gap: 12px; padding: 1px 14px; white-space: pre; }
  .listing .n { color: var(--code-num); width: 1.4em; text-align: right; flex-shrink: 0; user-select: none; }
  .listing .note { color: var(--gold-text); font-style: italic; margin-left: auto; padding-left: 18px; font-family: var(--font-body); font-size: 0.82rem; }
  .listing .s { color: var(--code-str); }
  .listing .f { color: var(--code-fn); }
  .listing .k { color: var(--code-kw); }
  .err { background: #2b0f14; color: #fca5a5; font-family: var(--font-mono); font-size: 0.85rem; border-left: 4px solid var(--red); border-radius: 6px; padding: 8px 12px; margin: 8px 0; white-space: pre-wrap; }
  .err-cap { font-size: 0.75rem; color: var(--muted); font-weight: 700; margin-top: 8px; }

  /* Multiple choice */
  .opts { display: grid; gap: 8px; margin-top: 10px; }
  .opt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; cursor: pointer; background: var(--card-raised); color: var(--text); }
  .opt:hover { border-color: var(--cobalt-text); background: var(--card-hover); }
  .opt input { accent-color: var(--cobalt); }
  .opt.right { border-color: var(--green); background: var(--green-bg); }
  .opt.wrong { border-color: var(--red); background: var(--red-bg); }
  .locked .opt { cursor: default; }
  .locked .opt:hover:not(.right):not(.wrong) { border-color: var(--line-strong); background: var(--card-raised); }

  /* Trace */
  .trace-grid { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0; }
  .trace-box { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
  .trace-box label { font-family: var(--font-mono); font-weight: 700; color: var(--heading); font-size: 0.9rem; }
  .trace-box input, .out-line input { font-family: var(--font-mono); font-size: 0.95rem; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; width: 100%; background: var(--card-raised); color: var(--text); }
  .trace-box input::placeholder, .out-line input::placeholder { color: var(--muted); }
  .ans-correct { border-color: var(--green) !important; background: var(--green-bg) !important; }
  .ans-wrong   { border-color: var(--red) !important;   background: var(--red-bg) !important; }
  .cell-msg { font-size: 0.78rem; color: var(--red-text); min-height: 1.1em; font-weight: 600; }
  .cell-msg .ans { color: var(--heading); font-family: var(--font-mono); }
  .out-line { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
  .out-line .n { font-family: var(--font-mono); color: var(--muted); padding-top: 9px; width: 6.5em; flex-shrink: 0; font-size: 0.8rem; }
  .out-line > div { flex: 1; }
  .rule-box { background: var(--card-raised); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; border: 1px solid var(--line); line-height: 1.6; margin-top: 6px; }

  /* Selection rows */
  .branch-row { display: grid; grid-template-columns: 9em 1fr; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .branch-row:first-of-type { border-top: none; }
  .branch-row .typed-lbl { font-weight: 700; color: var(--heading); padding-top: 9px; }
  .branch-row .typed-lbl b { font-family: var(--font-mono); background: var(--gold-bg); color: var(--gold-text); border: 1px solid var(--gold); border-radius: 4px; padding: 0 6px; }
  .branch-row .opts { margin-top: 0; grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 680px) { .branch-row { grid-template-columns: 1fr; } .branch-row .opts { grid-template-columns: 1fr; } }

  /* Sort (engine kept from the Y8 page; no sort question in this assessment yet) */
  .sort-pool, .sort-bin { border: 2px dashed var(--line-strong); border-radius: 10px; padding: 10px; min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; background: var(--card-raised); }
  .sort-bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sort-bin h4 { color: var(--heading); font-size: 1rem; margin-bottom: 4px; pointer-events: none; }
  .sort-bin.over, .sort-pool.over, .sort-bin.target { border-color: var(--cobalt-text); background: var(--cobalt-tint); }
  .sort-card { font-family: var(--font-mono); font-size: 0.9rem; background: var(--code-bg); color: var(--code-text); border-radius: 8px; padding: 7px 12px; cursor: grab; border: 2px solid var(--line); user-select: none; }
  .sort-card.selected { border-color: var(--gold); }
  .sort-card.is-right { border-color: var(--green); }
  .sort-card.is-wrong { border-color: var(--red); }
  .sort-card .should { display: block; font-family: var(--font-body); font-size: 0.72rem; color: var(--gold-text); }

  /* Code tasks */
  .code-checker { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 10px 0; }
  .checker-footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; background: var(--card-raised); border-top: 1px solid var(--line); }
  .btn-run, .btn-reset { padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.86rem; cursor: pointer; font-family: var(--font-body); background: transparent; }
  .btn-run   { color: var(--cobalt-text); border: 2px solid var(--cobalt-text); }
  .btn-reset { color: var(--muted); border: 2px solid var(--line-strong); }
  .btn-run:hover, .btn-reset:hover { color: var(--heading); border-color: var(--heading); }
  .btn-reset:disabled { opacity: .4; cursor: not-allowed; }
  .checker-footer .ac-btn { padding: 8px 18px; font-size: 0.88rem; }
  .code-title { font-weight: 700; color: var(--heading); font-size: 1rem; }
  .goal-line { font-size: 0.92rem; margin: 6px 0 4px; color: var(--text); line-height: 1.5; }
  .test-note { font-size: 0.84rem; color: var(--muted); margin: 6px 0; }
  .howto { background: var(--gold-bg); border: 1px solid var(--gold); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 0.9rem; line-height: 1.5; }
  .howto-h { font-weight: 700; color: var(--gold-text); margin-bottom: 4px; }
  .howto .listing { margin: 8px 0 2px; }
  .lock-msg { display: none; background: var(--green-bg); border: 1px solid var(--green); color: var(--green-text); border-radius: 6px; padding: 8px 12px; font-size: 0.86rem; font-weight: 700; margin-top: 8px; }
  .code-locked .lock-msg { display: block; }

  .req-list { list-style: none; margin: 8px 0; display: grid; gap: 6px; }
  .req-list li { display: flex; gap: 10px; align-items: flex-start; background: var(--card-raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; line-height: 1.5; font-size: 0.92rem; }
  .req-list li .tick { width: 22px; height: 22px; border-radius: 50%; background: var(--card-hover); color: var(--text); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }
  .req-list li.req-pass { border-color: var(--green); }
  .req-list li.req-pass .tick { background: var(--green); color: #fff; }
  .req-list li.req-fail { border-color: var(--red); }
  .req-list li.req-fail .tick { background: var(--red); color: #fff; }
  .req-diff { margin-top: 6px; font-size: 0.88rem; }
  .req-diff .k, .req-diff .key { color: var(--muted); font-size: 0.8rem; }
  .req-diff .words { font-family: var(--font-mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; margin: 3px 0; display: inline-block; line-height: 1.9; }
  .req-diff .w-ok { color: var(--green-text); font-weight: 600; }
  .req-diff .w-extra { color: var(--red-text); background: var(--red-bg); text-decoration: line-through 2px; border-radius: 3px; padding: 0 2px; }
  .req-diff .w-missing { color: var(--red-text); background: var(--red-bg); text-decoration: none; outline: 1.5px dashed var(--red); border-radius: 3px; padding: 0 2px; font-weight: 600; }

  .samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin: 8px 0; }
  .terminal { background: #05070a; color: #d6e4f0; border: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.9rem; border-radius: 8px; padding: 10px 14px; white-space: pre-wrap; line-height: 1.6; }
  .terminal .typed { color: #fcd34d; font-weight: 700; }
  .terminal .cap { display: block; color: #8796a5; font-family: var(--font-body); font-size: 0.75rem; margin-bottom: 4px; }

  /* Review */
  .review-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 0.92rem; }
  .review-table th, .review-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  .review-table th { background: var(--card-raised); color: var(--heading); font-weight: 700; font-size: 0.82rem; }
  .review-table tr.total td { font-weight: 700; background: var(--card-raised); }
  .review-table tr.row-todo td { background: var(--red-bg); color: var(--red-text); font-weight: 700; border-bottom-color: rgba(240,80,110,.4); }
  .review-table tr.row-todo td:first-child { box-shadow: inset 4px 0 0 var(--red); }
  .review-table tr.row-ok td:last-child { color: var(--green-text); font-weight: 700; }
  .todo-list { margin: 10px 0 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .todo-list button { background: var(--card-raised); border: 1px solid var(--amber); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-family: var(--font-body); font-size: 0.88rem; text-align: left; width: 100%; color: var(--text); }

  .transmit-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .transmit-note { font-size: 0.84rem; color: var(--muted); }

  /* The closing report: a station screen, dark phosphor in both modes (as the chapters' reports). */
  .sz-report { margin-top: 16px; background: #030a05; color: var(--crt); font-family: var(--hud-font); border: 2px solid var(--crt-faint); border-radius: 10px; padding: 16px 18px; line-height: 1.55; box-shadow: 0 0 24px rgba(92,255,143,.12) inset; text-shadow: 0 0 4px rgba(92,255,143,.3); }
  .sz-report .k { font-size: 0.72rem; letter-spacing: .12em; color: #2fae5c; }
  .sz-report h3 { font-size: 1.15rem; margin: 2px 0 8px; color: #b6ffcc; letter-spacing: .04em; }
  .sz-report h4 { font-size: 0.82rem; letter-spacing: .1em; color: #2fae5c; margin: 14px 0 4px; }
  .sz-report p { margin: 6px 0; }
  .sz-report .quote { color: #ffc95c; }
  .sz-report .ro { display: flex; gap: 8px; font-size: 0.9rem; }
  .sz-report .ro .dots { flex: 1; border-bottom: 1px dotted var(--crt-faint); transform: translateY(-5px); min-width: 20px; }
  .sz-report .ro .lv { width: 4.2em; text-align: right; }
  .sz-report .ok { color: var(--crt); }
  .sz-report .warn { color: #ffc95c; }
  .sz-report .danger { color: #ff6b78; }
  .sz-report .tool { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--crt-faint); }
  .sz-report .tool.lost { border-left-color: #ff6b78; }
  .sz-report .hook { margin-top: 14px; color: #b6ffcc; font-weight: 700; }
  .sz-report > * { animation: sz-in .35s ease both; }
  @keyframes sz-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { .panel.active { animation: none; } .sz-report > * { animation: none; } }
  @media (max-width: 600px) {
    .panel { padding-left: 16px; padding-right: 16px; }
    .header { padding: 14px 16px; }
  }

  /* ════════════════════════════════════════════════════════════════════
     LIGHT MODE ("day shift") — html[data-theme="light"], from the header switch. The work
     area goes light (white cards, near-black ink, deeper teal; text pairs ≥ 4.5:1, input
     borders 3:1). The station's own screens stay dark: the header console, the section
     readout lines, the sample-run terminals and the closing report.
     ════════════════════════════════════════════════════════════════════ */
  html[data-theme="light"],
  html[data-theme="light"] body {
    color-scheme: light;
    --canvas:       #eef1f4;

    --cobalt-text:  #0f6b63;   /* 6.4:1 on white */
    --cobalt-tint:  rgba(15,118,110,0.10);
    --text:         #0f172a;   /* 17.9:1 on white */
    --heading:      #0f172a;
    --muted:        #475569;   /* 7.6:1 on white */
    --amber:        #b45309;
    --amber-bg:     #fff6e5;
    --amber-text:   #7c3d06;
    --green:        #15803d;
    --green-text:   #14532d;
    --green-bg:     #e9f8ef;
    --red:          #c81e45;
    --red-text:     #9f1239;
    --red-bg:       #fdecef;
    --gold:         #b7791f;
    --gold-text:    #7a4a06;   /* 7:1 on --gold-bg */
    --gold-bg:      #fff8e6;
    --code-bg:      #f1f5f8;
    --code-text:    #1e293b;
    --code-num:     #5f6b7a;
    --code-str:     #2f6b1f;
    --code-fn:      #1d4ed8;
    --code-kw:      #8b2fb8;
    --focus-ring:   0 0 0 3px rgba(15,118,110,0.45);
  }
  html[data-theme="light"] body {
    background-image:
      radial-gradient(ellipse 80% 45% at 50% 0%, rgba(15,118,110,0.06), transparent 70%),
      radial-gradient(rgba(15,23,42,0.06) 1px, transparent 1.2px);
  }
  html[data-theme="light"] .err { background: #fdecef; color: #9f1239; }
  /* code editor: code-editor.js's light palette is Y8 purple; re-tint it slate, as in the chapters */
  html[data-theme="light"] .code-checker .output-panel { background: #f8fafc; border-left-color: var(--line); border-top-color: var(--line); }
  html[data-theme="light"] .code-checker .output-header { color: #475569; }
  html[data-theme="light"] .code-checker .line-nums { color: #5f6b7a; background: #e9eef3; border-right-color: var(--line); }
  html[data-theme="light"] .code-checker .checker-header { background: #e9eef3; color: #334155; border-color: var(--line); }
  html[data-theme="light"] .code-checker .checker-textarea { caret-color: #0f172a; }
  html[data-theme="light"] .code-checker .highlight-layer { color: #1e293b; }
  html[data-theme="light"] .code-checker .error-helper .eh-plain strong { color: var(--text); }
</style>
</head>

<body>

<!--
  Y9 Python · Lesson 6 — Assessment (not PRIMM), Station Zero Chapter 6 "Systems Check". Built on
  the Y8 Unit 1 assessment's engine (version 4). The questions and all marking live in checkers.js
  (unit tests in checkers.test.js); this page only renders and records them. The story is framing
  only: one line on each section heading, and the closing report on the Review tab (📡 Transmit),
  which never depends on the score.
  WRITING INSTRUCTIONS THAT CONTAIN CODE: never put a full stop or comma straight after code
  the student might type.
-->

<div id="done-banner" class="ac-banner"></div>
<div id="glow-overlay"></div>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">📝 Python Assessment — Systems Check</div>
      <div class="header-sub">Year 9 Python · Errors · Casting · Selection · while · for &amp; turtle · Functions</div>
      <div class="sz-strip">STATION ZERO · CHAPTER 6 — The rescue ship won't dock until every system passes.</div>
    </div>
    <div class="header-right" data-theme-toggle-slot>
      <div class="py-status" id="pyStatus">Python: loading…</div>
    </div>
  </div>
  <div class="score-row">
    <div class="score-pill" id="score-pill">Score: 0 / 54 (0%)</div>
    <div class="score-bar-wrap"><div class="score-bar" id="score-bar"></div></div>
    <div class="bonus-pill" id="bonus-pill"></div>
  </div>
</div>

<div class="tab-bar" id="tab-bar" role="tablist"></div>
<div id="panels"></div>

<div class="ac-toast" id="toast"></div>

<!-- Shows any unexpected page error at the bottom of the page (no dev console on student PCs). Keep this first. -->
<script src="../../../error-reporter.js"></script>
<script src="../../../activity-ui.js"></script>
<script src="../../../classroom.js"></script>

<script type="module">
import {
  LIVE_ITEMS as ITEMS, VERSION, SECTIONS, itemById, variantOf, optionOrder, itemMax, summarise,
  checkTraceValue, checkTraceOutput, showValue, markSort, evalCode,
  branchChoices, branchAnswer, mulberry32, shuffle, hashId,
  mergeChoices, stationState, inventoryRows, breachTools,
} from './checkers.js';
import { describe as describeDrawing } from '../L4_For_Loops/checkers.js';
import { preload, runPython } from '../../../pyodide-runner.js';
import { setupEditors, setEditorOutput, refreshEditor, runCode, replayRun } from '../../../code-editor.js';
import { attachTurtle, turtleReady, readDrawing } from '../../../turtle-canvas.js';

// ── Activity identity ──────────────────────────────────
// STORAGE_KEY also feeds the L7 DIRT lesson on the same device; the same summary goes to
// Drive with Classroom.submitResults(…, ACTIVITY_TITLE) for other devices.
const STORAGE_KEY    = 'oga_y9py_assess_v1';
const ACTIVITY_TITLE = 'Python Assessment — Systems Check';   // must match <!-- ACTIVITY title: -->

const $  = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const authBlocked = () => window.Classroom?.verifyAuth() === false;   // undefined (no classroom.js) never blocks

// ── State (saved on every change; locks are saved before anything is shown) ──
function fresh() {
  return { ver: VERSION, seed: Math.floor(Math.random() * 2 ** 31), tab: -1,   // -1 = the Start tab
           sel: {}, locked: {}, pts: {}, checked: {}, results: {}, code: {}, sort: {}, finished: false, transmitted: false };
}
let S;
try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); S = s && s.seed != null ? { ...fresh(), ver: null, ...s } : fresh(); }   // ver: null = started before versions were saved
catch (e) { S = fresh(); }
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {} }
save();

// This student's version of every item, and its marks.
const V = Object.fromEntries(ITEMS.map(i => [i.id, variantOf(i, S.seed)]));
const MAX = Object.fromEntries(ITEMS.map(i => [i.id, itemMax(i, S.seed)]));
const isCode = id => ['fix', 'reqs'].includes(V[id].kind);
const answered = id => isCode(id) ? !!S.checked[id] : !!S.locked[id];
// Marks still there to earn: an unanswered question, or a code question below full marks.
const outstanding = id => !answered(id) || (isCode(id) && (S.pts[id] || 0) < MAX[id]);

// Question numbers within each section: 1.1, 1.2 …
const QNO = {};
SECTIONS.forEach(s => ITEMS.filter(i => i.section === s.id).forEach((it, k) => { QNO[it.id] = s.bonus ? `★${k + 1}` : `${s.n}.${k + 1}`; }));

// ── Rendering helpers ──────────────────────────────────
function hl(code) {
  return esc(code)
    .replace(/(&quot;[^&]*?&quot;)/g, '<span class="s">$1</span>')
    .replace(/\b(print|input|int|float|str|range)\(/g, '<span class="f">$1</span>(')
    .replace(/^(\s*)(if|elif|else|while|for|def|import)\b/g, '$1<span class="k">$2</span>');
}
function listing(code, notes = {}) {
  return `<div class="listing">${code.split('\n').map((l, i) =>
    `<div class="ln"><span class="n">${i + 1}</span><span>${hl(l)}</span>${notes[i] ? `<span class="note">← ${esc(notes[i])}</span>` : ''}</div>`).join('')}</div>`;
}
const looksLikeCode = o => /[()"=*+<>]/.test(o);
const fmtOpt = o => looksLikeCode(o) ? `<code>${esc(o)}</code>` : esc(o);
const marksTag = id => {
  const m = MAX[id], code = isCode(id);
  return `${m} mark${m > 1 ? 's' : ''}${V[id].bonus ? ' (bonus)' : ''} · ${code ? 'check as often as you like' : 'one try'}`;
};
const head = id => `<div class="q-head"><span class="q-no">Question ${QNO[id]}</span><span class="q-marks">${marksTag(id)}</span></div>`;
// The evidence report (classroom.js) labels an answer by its data-title, so every answer
// names its question number. A hidden textarea adds what the report can't see: the version
// of a question this student got, and where they put each sort card. No answers go in it.
const plain = h => String(h).replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
const evTitle = (id, extra) => esc(`Question ${QNO[id]}${extra ? ' — ' + extra : ''}`);
const evNote = (id, label, text) => `<textarea hidden data-evidence="${id}" data-title="${evTitle(id, label)}">${esc(text)}</textarea>`;
const isVariant = id => !!ITEMS.find(i => i.id === id).variants;
const lockBtn = (id, label = '🔒 Lock in answer') => `<div class="row"><button class="ac-btn" data-lock="${id}" id="lock_${id}">${label}</button></div>`;

function renderMcq(id) {
  const v = V[id];
  const opts = optionOrder(id, v.opts.length, S.seed).map(k =>
    `<label class="opt" data-k="${k}"><input type="radio" name="mcq_${id}" value="${k}" data-title="${evTitle(id, plain(v.q))}"><span>${fmtOpt(v.opts[k])}</span></label>`).join('');
  return `<div class="question-card" id="card_${id}">${head(id)}
    <span class="q-label">${v.q}</span>
    ${v.code ? listing(v.code) : ''}
    ${v.error ? `<div class="err-cap">Python shows:</div><pre class="err">${esc(v.error)}</pre>` : ''}
    ${isVariant(id) ? evNote(id, 'version shown', plain(v.q) + (v.code ? '\n' + v.code : '')) : ''}
    <div class="opts">${opts}</div>
    ${lockBtn(id)}
    <div class="feedback" id="fb_${id}"></div></div>`;
}

function renderTrace(id) {
  const v = V[id];
  const notes = Object.fromEntries(Object.entries(v.typed || {}).map(([i, t]) => [i, `the user types ${t}`]));
  // Boxes first, then the printed lines. With the printed lines first (third sitting), labelled
  // "line 1" / "line 2" right under the program, the printed lines fell from 52% to 22%: students
  // typed the program's line 1 and 2, or a box's value. So they are "1st print" / "2nd print".
  const ORD = ['1st', '2nd', '3rd', '4th', '5th'];
  const boxes = v.vars.length ? `
    <span class="q-label" style="margin-top:10px">📦 What is in each box after the <strong>last</strong> line has run?</span>
    <div class="rule-box">Write just what is in the box, like <code>Sam</code> (you can put quotes round text if you like)</div>
    <div class="trace-grid">${v.vars.map(x => `<div class="trace-box">
      <label for="tr_${id}_v_${x.name}">${x.name}</label>
      <input type="text" id="tr_${id}_v_${x.name}" data-trace="${id}" data-title="${evTitle(id, 'box ' + x.name)}" autocomplete="off" spellcheck="false" placeholder="?">
      <div class="cell-msg" id="msg_${id}_v_${x.name}"></div></div>`).join('')}</div>` : '';
  const outs = `
    <span class="q-label" style="margin-top:10px">🖥️ What does it print?</span>
    ${v.output.length > 1 ? '<div class="rule-box">Only <code>print()</code> shows anything on screen. Write each line it shows, in the order they appear, one per box.</div>' : ''}
    ${v.output.map((_, i) => `<div class="out-line"><span class="n">${v.output.length > 1 ? ORD[i] + ' printed' : 'printed'}</span><div>
      <input type="text" id="tr_${id}_o_${i}" data-trace="${id}" data-title="${evTitle(id, 'printed line ' + (i + 1))}" autocomplete="off" spellcheck="false" placeholder="exactly what is printed">
      <div class="cell-msg" id="msg_${id}_o_${i}"></div></div></div>`).join('')}`;
  return `<div class="question-card" id="card_${id}">${head(id)}
    <span class="q-label">${v.q}</span>
    ${listing(v.lines.join('\n'), notes)}
    ${isVariant(id) ? evNote(id, 'version shown', v.lines.join('\n') + Object.entries(v.typed || {}).map(([i, t]) => `\n(line ${+i + 1}: the user types ${t})`).join('')) : ''}
    ${boxes}${outs}
    ${lockBtn(id, '🔒 Lock in my trace')}
    <div class="feedback" id="fb_${id}"></div></div>`;
}

function renderBranch(id) {
  const v = V[id];
  const choices = branchChoices(v);
  const order = optionOrder(id, choices.length, S.seed);
  const rows = v.rows.map(([typed], r) => `<div class="branch-row" id="brow_${id}_${r}">
      <div class="typed-lbl">User types <b>${esc(typed)}</b></div>
      <div class="opts">${order.map(k => `<label class="opt" data-k="${k}"><input type="radio" name="br_${id}_${r}" value="${k}" data-title="${evTitle(id, 'user types ' + typed)}"><span>${esc(choices[k])}</span></label>`).join('')}</div>
    </div>`).join('');
  return `<div class="question-card" id="card_${id}">${head(id)}
    <span class="q-label">${v.q}</span>
    ${listing(v.code)}
    ${rows}
    ${lockBtn(id)}
    <div class="feedback" id="fb_${id}"></div></div>`;
}

function renderSortItem(id) {
  const v = V[id];
  const bins = shuffle(v.bins, mulberry32(S.seed + hashId(id) + 7));
  return `<div class="question-card" id="card_${id}">${head(id)}
    <span class="q-label">${v.q}</span>
    ${listing(v.code)}
    <span class="q-label">Sort every card into the right group. Drag it, or click a card and then click a group.</span>
    ${evNote(id, 'where each card was put', '')}
    <div class="sort-pool" data-sort="${id}" data-bin=""></div>
    <div class="sort-bins">${bins.map(b => `<div class="sort-bin" data-sort="${id}" data-bin="${b.id}"><h4>${b.label}</h4></div>`).join('')}</div>
    ${lockBtn(id)}
    <div class="feedback" id="fb_${id}"></div></div>`;
}

function renderCodeItem(id) {
  const v = V[id];
  const samples = v.samples ? `<div class="samples">${v.samples.map((run, i) => `<div class="terminal"><span class="cap">Sample run ${i + 1}</span>${
    run.map(([text, typed]) => esc(text) + (typed ? `<span class="typed">${esc(typed)}</span>` : '')).join('\n')}</div>`).join('')}</div>` : '';
  const reqs = v.reqs ? `<p style="font-weight:700;color:var(--heading);margin-top:10px">Your program must (${v.reqs.length > 1 ? '1 mark each' : '1 mark'}):</p>
    <ul class="req-list" id="req_${id}">${v.reqs.map((r, i) => `<li><span class="tick">${i + 1}</span><span>${r.text}</span></li>`).join('')}</ul>` : '';
  const resettable = v.kind === 'fix' || v.resettable;
  const howto = v.howto ? `<div class="howto"><div class="howto-h">💡 How to do it</div>${v.howto.text}${listing(v.howto.code)}</div>` : '';
  return `<div class="question-card" id="card_${id}">${head(id)}
    <div class="code-title">${esc(v.title)}</div>
    <div class="goal-line">🎯 ${v.goal}</div>
    ${howto}${samples}${reqs}
    ${v.testNote || v.note ? `<div class="test-note">${esc(v.testNote || v.note)}</div>` : ''}
    <div class="code-checker">
      <textarea class="checker-textarea" id="ed_${id}" data-title="${evTitle(id, v.title)}">${esc(v.starter)}</textarea>
      <div class="checker-footer">
        <button class="btn-run" data-run="ed_${id}">▶ Run code</button>
        <button class="ac-btn" data-check="${id}" id="check_${id}">✓ Check</button>
        ${resettable ? `<button class="btn-reset" data-reset="${id}" id="reset_${id}">↺ Reset to the start</button>` : ''}
      </div>
    </div>
    <div class="feedback" id="fb_${id}"></div>
    <div class="lock-msg">🔒 Full marks — this question is locked.</div></div>`;
}

const RENDER = { mcq: renderMcq, trace: renderTrace, branch: renderBranch, sort: renderSortItem, fix: renderCodeItem, reqs: renderCodeItem };

// ── Build the page ─────────────────────────────────────
const REVIEW = SECTIONS.length;
const START = -1;   // the "how it works" tab, first in the bar; the page opens on it
const panelId = i => 'panel-' + (i === START ? 'start' : i);
$('#tab-bar').innerHTML = `<button class="tab" data-idx="${START}">📋 Start here</button>` + SECTIONS.map((s, i) =>
  `<button class="tab" data-idx="${i}">${s.n} · ${esc(s.label)} <span class="count" id="count_${s.id}"></span></button>`).join('')
  + `<button class="tab" data-idx="${REVIEW}">✓ Review</button>`;

$('#panels').innerHTML = `<div class="panel" id="panel-start">
    <div class="task-header"><div class="task-badge">📋</div>
      <div><div class="task-title">How this assessment works</div><div class="task-sub">Read this first</div></div></div>
    <ul class="how-list">
      <li>There are <strong>7 sections</strong>, one for each thing you learned, plus a ★ bonus. Do them in <strong>any order</strong>. The number on each tab shows how many questions you have answered.</li>
      <li><strong>Multiple choice and trace questions: one try only.</strong> When you press <strong>🔒 Lock in</strong> your answer is final, and then you are shown the right answer.</li>
      <li><strong>Code questions:</strong> press <strong>▶ Run code</strong> and <strong>✓ Check</strong> as often as you like. Your best mark is kept. Full marks locks the question.</li>
      <li>If you get an error, read the <strong>last line</strong> first, then find the line number it gives. Still stuck? Press <strong>💡 Get help</strong> to see what the error means.</li>
      <li>Your answers save automatically and go to Google Classroom as you work. When you have finished, open the <strong>✓ Review</strong> tab to check nothing is left, then press <strong>📡 Transmit</strong>.</li>
    </ul>
    <div class="next-row"><button class="ac-btn" data-goto="0">Start: ${esc(SECTIONS[0].label)} →</button></div>
  </div>` + SECTIONS.map((s, i) => {
  const items = ITEMS.filter(it => it.section === s.id);
  const marks = items.reduce((t, it) => t + MAX[it.id], 0);
  return `<div class="panel" id="panel-${i}">
    <div class="task-header">
      <div class="task-badge ${s.bonus ? 'ext' : ''}">${s.n}</div>
      <div><div class="task-title">${esc(s.label)}</div>
        <div class="task-sub">${esc(s.lesson)} · ${marks} ${s.bonus ? 'bonus marks — not part of your score' : 'marks'}</div></div>
    </div>
    <div class="sz-line"><span class="sz-room">${esc(s.room)}</span> ${esc(s.story)}</div>
    ${s.bonus ? '<div class="goal">🎯 Only try this once you have finished everything else. It is a bonus, so it can only add to how well you did.</div>' : ''}
    ${s.id === 'program' ? '<div class="goal">🎯 Write one step at a time, and press ✓ Check after each one: every step you get right is a mark. You can use your own words for the welcome message.</div>' : ''}
    ${items.map(it => RENDER[V[it.id].kind](it.id)).join('')}
    <div class="next-row"><button class="ac-btn" data-goto="${i + 1}">${i + 1 < REVIEW ? `Next: ${esc(SECTIONS[i + 1].label)} →` : 'Go to ✓ Review →'}</button></div>
  </div>`;
}).join('') + `<div class="panel" id="panel-${REVIEW}">
    <div class="task-header"><div class="task-badge">✓</div>
      <div><div class="task-title">Review</div><div class="task-sub">Check nothing is left before you finish</div></div></div>
    <table class="review-table" id="review-table"></table>
    <div id="review-todo"></div>
    <div class="transmit-row">
      <button class="ac-btn" id="transmit">📡 Transmit the systems check</button>
      <span class="transmit-note">Your teacher will tell you when. You can keep working on your answers afterwards.</span>
    </div>
    <div id="sz-report" class="sz-report" hidden aria-live="polite"></div>
  </div>`;

// ── Scoring + submission ───────────────────────────────
function refreshScore() {
  const s = summarise(S.pts, S.seed);
  $('#score-pill').textContent = `Score: ${s.earned} / ${s.max} (${s.pct}%)`;
  $('#score-bar').style.width = s.pct + '%';
  $('#bonus-pill').textContent = s.bonus ? `★ +${s.bonus} bonus` : '';
  // Tab colours: green = nothing left; amber = started, something left; red = something left
  // and the student has already answered something in a later section (so it was skipped).
  const secIds = SECTIONS.map(sec => ITEMS.filter(it => it.section === sec.id).map(it => it.id));
  const started = secIds.map(ids => ids.some(answered));
  SECTIONS.forEach((sec, i) => {
    const ids = secIds[i];
    const n = ids.filter(answered).length, left = ids.some(outstanding);
    const skipped = left && started.slice(i + 1).some(Boolean);
    const partial = left && !skipped && n > 0;
    const tab = $(`.tab[data-idx="${i}"]`);
    $('#count_' + sec.id).textContent = `${skipped ? '⚠ ' : ''}${n}/${ids.length}`;
    tab.classList.toggle('done', !left);
    tab.classList.toggle('skipped', skipped);
    tab.classList.toggle('partial', partial);
    tab.title = !left ? 'All done' : skipped ? 'You skipped something here — there are still marks to get'
      : partial ? 'Started — there are still marks to get' : '';
  });
  renderReview(s);
  return s;
}
// Called after every answer is locked or checked: grade + evidence + per-section results.
// The answers themselves (seed, sel, sort, code, results) go too, so the L7 Targeted Practice
// lesson can show a student their own mistakes on a different computer.
function submit() {
  const s = refreshScore();
  window.Classroom?.submitGrade(s.pct, ACTIVITY_TITLE);
  const code = Object.fromEntries(Object.entries(S.code).filter(([k]) => S.checked[k.slice(3)]));
  window.Classroom?.submitResults({ points: S.pts, sections: s.sections, earned: s.earned, max: s.max, pct: s.pct, bonus: s.bonus,
    ver: S.ver, seed: S.seed, sel: S.sel, sort: S.sort, results: S.results, code }, ACTIVITY_TITLE);
  checkFinished(s);
}
const coreIds = ITEMS.filter(i => !i.bonus).map(i => i.id);
function checkFinished(s) {
  if (S.finished || !coreIds.every(answered)) return;
  S.finished = true;
  save();
  showFinished(s, true);
}
function showFinished(s, celebrate) {
  const gold = s.pct === 100;
  const b = $('#done-banner');
  b.textContent = gold ? `🏆 Every question answered — full marks!` : `✅ Every question answered — you scored ${s.pct}%. You can still improve your code answers or try the ★ bonus.`;
  b.classList.add('show', gold ? 'gold' : 'green');
  $('#glow-overlay').classList.add(gold ? 'gold' : 'green', 'show');
  setTimeout(() => b.classList.remove('show'), 7000);
  if (celebrate && gold) window.ActivityUI?.launchCelebration({ percent: 100 });
}

function renderReview(s) {
  const rows = SECTIONS.map((sec, i) => {
    const ids = ITEMS.filter(it => it.section === sec.id).map(it => it.id);
    const se = s.sections[sec.id];
    const left = ids.filter(outstanding);
    const unanswered = left.filter(id => !answered(id)).length, codeLeft = left.length - unanswered;
    const status = sec.bonus ? (left.length ? 'Optional' : '✓ Done')
      : !left.length ? '✓ Done'
      : [unanswered && `${unanswered} not answered`, codeLeft && `${codeLeft} code task${codeLeft > 1 ? 's' : ''} not finished`].filter(Boolean).join(' · ');
    const cls = sec.bonus ? '' : left.length ? 'row-todo' : 'row-ok';
    return `<tr class="${cls}"><td>${sec.n} · ${esc(sec.label)}</td><td>${esc(sec.lesson)}</td><td>${ids.filter(answered).length} / ${ids.length}</td><td>${se.earned} / ${se.max}${sec.bonus ? ' bonus' : ''}</td><td>${left.length && !sec.bonus ? '⚠ ' : ''}${status}</td></tr>`;
  }).join('');
  $('#review-table').innerHTML = `<tr><th>Section</th><th>Lesson</th><th>Answered</th><th>Marks</th><th>Still to do</th></tr>${rows}
    <tr class="total"><td colspan="3">Total (not counting the bonus)</td><td colspan="2">${s.earned} / ${s.max} (${s.pct}%)</td></tr>`;
  const sectionOf = id => esc(SECTIONS.find(x => x.id === V[id].section).label);
  const todo = coreIds.filter(id => !answered(id));
  const unfinished = coreIds.filter(id => answered(id) && outstanding(id));
  const list = (title, ids, note) => ids.length ? `<p style="margin-top:14px;font-weight:700;color:var(--red)">${title} (${ids.length}):</p>
       <ul class="todo-list">${ids.map(id => `<li><button data-goto-item="${id}">Question ${QNO[id]} — ${sectionOf(id)}${note(id)} →</button></li>`).join('')}</ul>` : '';
  $('#review-todo').innerHTML = todo.length || unfinished.length
    ? list('Still to answer', todo, () => '')
      + list('Code not finished — more marks to get', unfinished, id => ` (${S.pts[id] || 0} / ${MAX[id]}, not every requirement met yet)`)
    : `<div class="all-done">✅ You have answered every question and every code question has full marks. Your teacher can see your results. If there is time left, have a go at the ★ bonus.</div>`;
}

// ══ One-try choice answers: show, then hide ═════════════
// Right/wrong and the right answer show for REVEAL_MS, then the options are hidden so a
// neighbour can't copy them. A reload shows only the hidden state. The radios stay checked
// (just hidden), so the Classroom evidence report still records the student's choice.
const REVEAL_MS = 6000;
function hideAnswer(id, summary, justLocked) {
  const card = $('#card_' + id), fb = $('#fb_' + id);
  const hide = () => {
    card.classList.add('answer-hidden');

  };

}

// ══ Multiple choice ═════════════════════════════════════
function applyMcq(id, justLocked) {
  const card = $('#card_' + id);
  const chosen = S.sel[id];
  if (chosen != null) { const r = card.querySelector(`input[value="${chosen}"]`); if (r) r.checked = true; }
  if (!S.locked[id]) return;
  card.classList.add('locked', S.pts[id] ? 'is-right' : 'is-wrong');
  card.querySelectorAll('.opt').forEach(o => {
    o.querySelector('input').disabled = true;
    const k = +o.dataset.k;
    if (k === 0) o.classList.add('right');
    else if (k === chosen) o.classList.add('wrong');
  });
  $('#lock_' + id).disabled = true;
  const fb = $('#fb_' + id);
  fb.innerHTML = S.pts[id] ? '✅ Correct.' : '❌ Not this time — the right answer is in green.';
  fb.className = 'feedback ' + (S.pts[id] ? 'correct' : 'wrong');
  if (!card.querySelector('.why')) fb.insertAdjacentHTML('afterend', `<div class="why"><strong>Why:</strong> ${esc(V[id].why)}</div>`);
  hideAnswer(id, S.pts[id] ? '✅ you got it right' : '❌ you got it wrong', justLocked);
}
function lockMcq(id) {
  const fb = $('#fb_' + id);
  if (S.sel[id] == null) { fb.textContent = 'Choose an answer first.'; fb.className = 'feedback info'; return; }
  S.locked[id] = true;
  S.pts[id] = S.sel[id] === 0 ? MAX[id] : 0;
  save();
  applyMcq(id, true);
  submit();
}

// ══ Trace ═══════════════════════════════════════════════
const traceFields = id => {
  const v = V[id];
  return [
    ...v.vars.map(x => ({ key: `tr_${id}_v_${x.name}`, msg: `msg_${id}_v_${x.name}`, mark: t => checkTraceValue(x, t), answer: showValue(x) })),
    ...v.output.map((line, i) => ({ key: `tr_${id}_o_${i}`, msg: `msg_${id}_o_${i}`, mark: t => checkTraceOutput(line, t), answer: line })),
  ];
};
function applyTrace(id) {
  const vals = S.sel[id] || {};
  traceFields(id).forEach(f => { $('#' + f.key).value = vals[f.key] ?? ''; });
  if (!S.locked[id]) return;
  let right = 0;
  traceFields(id).forEach(f => {
    const r = f.mark(vals[f.key]);
    const inp = $('#' + f.key);
    inp.readOnly = true;
    inp.classList.add(r.ok ? 'ans-correct' : 'ans-wrong');
    $('#' + f.msg).innerHTML = r.ok ? '' : `${esc(r.msg)} Answer: <span class="ans">${esc(f.answer)}</span>`;
    if (r.ok) right++;
  });

  card.classList.add(right === MAX[id] ? 'is-right' : right ? 'is-partial' : 'is-wrong');
  $('#lock_' + id).disabled = true;
  const fb = $('#fb_' + id);
  fb.textContent = right === MAX[id] ? '✅ Your trace is spot on.' : `${right} of ${MAX[id]} right. The right answers are shown under the red boxes.`;
  fb.className = 'feedback ' + (right === MAX[id] ? 'correct' : right ? 'partial' : 'wrong');
}
function lockTrace(id) {
  const vals = S.sel[id] || {};
  const fb = $('#fb_' + id);
  if (traceFields(id).some(f => !String(vals[f.key] ?? '').trim())) {
    fb.textContent = 'Fill in every box first.'; fb.className = 'feedback info'; return;
  }
  S.locked[id] = true;
  S.pts[id] = traceFields(id).filter(f => f.mark(vals[f.key]).ok).length;
  save();
  applyTrace(id);
  submit();
}

// ══ Selection rows ══════════════════════════════════════
function applyBranch(id, justLocked) {
  const v = V[id], sel = S.sel[id] || {};
  v.rows.forEach((_, r) => { if (sel[r] != null) { const x = $(`input[name="br_${id}_${r}"][value="${sel[r]}"]`); if (x) x.checked = true; } });
  if (!S.locked[id]) return;
  const card = $('#card_' + id);
  card.classList.add('locked');
  let right = 0;
  v.rows.forEach((row, r) => {
    const want = branchAnswer(row);
    if (sel[r] === want) right++;
    $$(`#brow_${id}_${r} .opt`).forEach(o => {
      o.querySelector('input').disabled = true;
      const k = +o.dataset.k;
      if (k === want) o.classList.add('right');
      else if (k === sel[r]) o.classList.add('wrong');
    });
  });
  card.classList.add(right === MAX[id] ? 'is-right' : right ? 'is-partial' : 'is-wrong');
  $('#lock_' + id).disabled = true;
  const fb = $('#fb_' + id);
  fb.textContent = right === MAX[id] ? '✅ All right — including the boundary value.' : `${right} of ${MAX[id]} right. The right answers are in green.`;
  fb.className = 'feedback ' + (right === MAX[id] ? 'correct' : right ? 'partial' : 'wrong');
  if (!card.querySelector('.why')) fb.insertAdjacentHTML('afterend', `<div class="why"><strong>Why:</strong> Python checks the tests from the top, and only the <strong>first</strong> True one runs its indented line; the rest are skipped. <code>${esc(v.after)}</code> has no indent, so it is always printed. Check the number on the boundary carefully: <code>&gt;=</code> includes it, <code>&gt;</code> and <code>&lt;</code> do not.</div>`);
  hideAnswer(id, `${right === MAX[id] ? '✅' : right ? '🟡' : '❌'} ${right} of ${MAX[id]} right`, justLocked);
}
function lockBranch(id) {
  const sel = S.sel[id] || {};
  const fb = $('#fb_' + id);
  if (V[id].rows.some((_, r) => sel[r] == null)) { fb.textContent = 'Choose an answer for every row first.'; fb.className = 'feedback info'; return; }
  S.locked[id] = true;
  S.pts[id] = V[id].rows.filter((row, r) => sel[r] === branchAnswer(row)).length;
  save();
  applyBranch(id, true);
  submit();
}

// ══ Sort ════════════════════════════════════════════════
let selectedCard = null;
function applySort(id) {
  const v = V[id], place = S.sort[id] || {};
  const card = $('#card_' + id);
  const zones = { '': card.querySelector('.sort-pool') };
  card.querySelectorAll('.sort-bin').forEach(b => { zones[b.dataset.bin] = b; b.querySelectorAll('.sort-card').forEach(c => c.remove()); });
  zones[''].innerHTML = '';
  const locked = !!S.locked[id];
  const marked = locked ? markSort(v, place) : null;
  shuffle(v.cards, mulberry32(S.seed + hashId(id))).forEach(c => {
    const el = document.createElement('div');
    el.className = 'sort-card' + (selectedCard === c.id ? ' selected' : '');
    el.dataset.id = c.id;
    el.dataset.sort = id;
    el.draggable = !locked;
    el.textContent = c.expr;
    if (locked) {
      el.classList.add(marked.results[c.id] ? 'is-right' : 'is-wrong');
      if (!marked.results[c.id]) el.insertAdjacentHTML('beforeend', `<span class="should">should be: ${esc(v.bins.find(b => b.id === c.bin).label)}</span>`);
    }
    (zones[place[c.id] || ''] || zones['']).appendChild(el);
  });
  card.querySelectorAll('.sort-bin').forEach(b => b.classList.toggle('target', !locked && !!selectedCard));
  card.querySelector('textarea[data-evidence]').value = v.cards.map(c =>
    `${c.expr}  →  ${place[c.id] ? plain(v.bins.find(b => b.id === place[c.id]).label) : '(not sorted)'}`).join('\n');
  if (!locked) return;
  card.classList.add('locked', marked.right === v.cards.length ? 'is-right' : marked.pts ? 'is-partial' : 'is-wrong');
  $('#lock_' + id).disabled = true;
  const fb = $('#fb_' + id);
  fb.textContent = `${marked.right} of ${v.cards.length} cards in the right group = ${marked.pts} mark${marked.pts === 1 ? '' : 's'}.`;
  fb.className = 'feedback ' + (marked.right === v.cards.length ? 'correct' : marked.pts ? 'partial' : 'wrong');
}
function moveCard(id, cardId, bin) {
  if (S.locked[id] || !cardId) return;
  S.sort[id] = S.sort[id] || {};
  if (bin) S.sort[id][cardId] = bin; else delete S.sort[id][cardId];
  selectedCard = null;
  save();
  applySort(id);
}
function lockSort(id) {
  const r = markSort(V[id], S.sort[id] || {});
  const fb = $('#fb_' + id);
  if (!r.placed) { fb.textContent = 'Put every card into a group first.'; fb.className = 'feedback info'; return; }
  S.locked[id] = true;
  S.pts[id] = r.pts;
  save();
  applySort(id);
  submit();
}
document.addEventListener('click', e => {
  const c = e.target.closest('.sort-card');
  if (c && !S.locked[c.dataset.sort]) { selectedCard = selectedCard === c.dataset.id ? null : c.dataset.id; applySort(c.dataset.sort); return; }
  const z = e.target.closest('.sort-bin, .sort-pool');
  if (z && selectedCard) moveCard(z.dataset.sort, selectedCard, z.dataset.bin);
});
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.sort-card'); if (c) e.dataTransfer.setData('text/plain', c.dataset.id); });
document.addEventListener('dragover', e => { const z = e.target.closest?.('.sort-bin, .sort-pool'); if (z && !S.locked[z.dataset.sort]) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('.sort-bin, .sort-pool')?.classList.remove('over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest?.('.sort-bin, .sort-pool');
  if (!z) return;
  e.preventDefault();
  z.classList.remove('over');
  moveCard(z.dataset.sort, e.dataTransfer.getData('text/plain'), z.dataset.bin);
});

// ══ Code questions ══════════════════════════════════════
// Run the code once per set of test answers, one after another (one shared Python).
// Turtle tasks also keep what each run drew (read straight after it, before the next run).
const usesTurtle = code => /\bimport\s+turtle\b/.test(code);
async function runTests(code, tests) {
  const runs = [];
  if (usesTurtle(code)) await turtleReady;
  for (const inputs of tests) {
    const run = { ...(await runPython(code, { inputs, onInputsExhausted: 'error' })), inputs };
    if (usesTurtle(code)) run.drawing = readDrawing();
    runs.push(run);
  }
  return runs;
}
// Show the first failing run (or the first run) in the editor's output panel; a turtle run is
// replayed so its drawing appears on the turtle screen.
function showRun(ta, runs) {
  const r = runs.find(x => !x.ok) || runs[0];
  if (r.drawing) { replayRun(ta, r); return; }
  const label = r.inputs.length ? `[test run — typed: ${r.inputs.join(', ')}]\n` : '';
  setEditorOutput(ta, r.ok ? label + (r.output || '(no output)') : r.output, !r.ok, r.ok ? null : (r.line ?? null));
}
// diffs[i] (optional): a nearly-right printed line for a failed requirement, shown word by
// word inside it: green words are right, red crossed-out ones shouldn't be there, and a
// dashed red box is a word that is missing.
function applyReqTicks(id, results, diffs = []) {
  const list = $('#req_' + id);
  if (!list || !results) return;
  list.querySelectorAll('li').forEach((li, i) => {
    li.classList.toggle('req-pass', !!results[i]);
    li.classList.toggle('req-fail', !results[i]);
    li.querySelector('.tick').textContent = results[i] ? '✓' : '✗';
    li.querySelector('.req-diff')?.remove();
    const d = !results[i] && diffs?.[i];
    if (d) li.lastElementChild.insertAdjacentHTML('beforeend', reqDiffHtml(d));
  });
}
const DIFF_TAG = { ok: ['span', ''], extra: ['del', ' title="not in the sample: take this out"'], missing: ['ins', ' title="missing: add this"'] };
function reqDiffHtml(d) {
  const words = d.words.map(x => { const [tag, attr] = DIFF_TAG[x.kind]; return `<${tag} class="w-${x.kind}"${attr}>${esc(x.w)}</${tag}>`; }).join(' ');
  const typed = d.typed?.length ? `When the user types ${d.typed.map(t => `<strong>${esc(t)}</strong>`).join(' then ')}, your` : 'Your';
  const keys = [...new Set(d.words.map(x => x.kind))].filter(k => k !== 'ok')
    .map(k => k === 'extra' ? '<del class="w-extra">red, crossed out</del> = take it out' : '<ins class="w-missing">red box</ins> = missing, add it').join(' · ');
  return `<div class="req-diff"><div class="k">${typed} line, word by word:</div><div class="words">${words}</div><div class="key"><span class="w-ok">green</span> = right${keys ? ' · ' + keys : ''}</div></div>`;
}
function applyCode(id) {
  if (!S.checked[id]) return;
  const best = S.pts[id] || 0, max = MAX[id];
  const card = $('#card_' + id);
  card.classList.remove('is-right', 'is-partial', 'is-wrong');
  card.classList.add(best === max ? 'is-right' : best ? 'is-partial' : 'is-wrong');
  // Fix-it answers saved before they had requirement lists have no results: full marks = all ticked.
  applyReqTicks(id, S.results[id] || (best === max ? V[id].reqs.map(() => true) : null));
  if (best === max) {
    card.classList.add('code-locked');
    $('#ed_' + id).readOnly = true;
    $('#check_' + id).disabled = true;
    const rs = $('#reset_' + id); if (rs) rs.disabled = true;
  }
}
async function checkCode(id) {
  if (S.pts[id] === MAX[id]) return;
  const ta = $('#ed_' + id), fb = $('#fb_' + id), btn = $('#check_' + id);
  btn.disabled = true;
  fb.textContent = 'Running your code with the test answers…'; fb.className = 'feedback info';
  try {
    const runs = await runTests(ta.value, V[id].tests);
    showRun(ta, runs);
    const r = evalCode(V[id], ta.value, runs);
    if (V[id].turtle && r.pts < MAX[id] && runs[0]?.ok) r.msg += ` The turtle drew ${describeDrawing(runs[0].drawing)}.`;
    S.checked[id] = true;
    if (r.pts >= (S.pts[id] || 0)) { S.pts[id] = r.pts; S.results[id] = r.results || null; }
    save();
    applyCode(id);
    applyReqTicks(id, r.results, r.diffs);   // this attempt's ticks, even if an earlier attempt scored more
    const best = S.pts[id], max = MAX[id];
    fb.textContent = `${r.pts === max ? '✅' : r.pts ? '🟡' : '❌'} ${r.msg} This check: ${r.pts}/${max}.${best > r.pts ? ` Your best so far (${best}/${max}) is kept.` : ''}`;
    fb.className = 'feedback ' + (r.pts === max ? 'correct' : r.pts ? 'partial' : 'wrong');
    submit();
  } catch (err) {
    window.ErrorReporter?.report('Code check', err);
  } finally {
    if (S.pts[id] !== MAX[id]) btn.disabled = false;
  }
}

// ── Clicks, selections, typing ─────────────────────────
const LOCKERS = { mcq: lockMcq, trace: lockTrace, branch: lockBranch, sort: lockSort };
document.addEventListener('click', e => {
  const l = e.target.closest('[data-lock]');
  if (l) { if (!authBlocked() && !S.locked[l.dataset.lock]) LOCKERS[V[l.dataset.lock].kind](l.dataset.lock); return; }
  const c = e.target.closest('[data-check]');
  if (c) { if (!authBlocked()) checkCode(c.dataset.check); return; }

    const ta = $('#ed_' + r.dataset.reset);

  const g = e.target.closest('[data-goto]');

  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name?.startsWith('mcq_')) { const id = t.name.slice(4); if (!S.locked[id]) { S.sel[id] = +t.value; save(); } }
  const m = t.name?.match(/^br_(.+)_(\d+)$/);

document.addEventListener('input', e => {
  const id = e.target.dataset?.trace;
  if (id && !S.locked[id]) { S.sel[id] = { ...(S.sel[id] || {}), [e.target.id]: e.target.value }; save(); }
});

// Code is saved as it is typed.
$$('.checker-textarea').forEach(ta => {
  if (S.code[ta.id] != null) ta.value = S.code[ta.id];
  ta.addEventListener('input', () => { S.code[ta.id] = ta.value; save(); });
});

// ══ Station Zero: the closing report ════════════════════
// Built from the student's story choices only (localStorage 'sz_choices', merged with the
// Drive copy "Station Zero — Results" when signed in through Classroom). The score never
// changes it. Its staggered fade-in plays once; a reload shows it straight away.
async function storyChoices() {
  let local = {};
  try { local = JSON.parse(localStorage.getItem('sz_choices') || '{}'); } catch (e) {}
  const C = window.Classroom;
  if (!C?.isClassroomContext || !C.fetchResults) return mergeChoices(local, null);
  const remote = await Promise.race([C.fetchResults('Station Zero').catch(() => null), new Promise(r => setTimeout(() => r(null), 4000))]);
  return mergeChoices(local, remote);
}
const readout = r => `<div class="ro"><span>${esc(r.label.toUpperCase())}</span><span class="dots"></span><span class="${r.level}">${esc(r.value)}</span><span class="lv ${r.level}">[${{ ok: 'OK', warn: 'WARN', danger: 'CRIT' }[r.level]}]</span></div>`;
function renderReport(st, animate) {
  const tools = breachTools(st);
  const el = $('#sz-report');
  el.innerHTML = `
    <div class="k">STATION ZERO · CHAPTER 6 · SYSTEMS CHECK</div>
    <h3>TRANSMITTED. RESCUE SHIP LOCKING ON.</h3>
    <h4>WHAT YOUR CHOICES HAVE LEFT YOU</h4>
    ${inventoryRows(st).map(readout).join('')}
    <h4>⚠ BREACH</h4>
    <p>The docking clamps fire on their own. Something in Maintenance has taken them. The station lurches out of orbit and you are thrown against a bulkhead.</p>
    <p class="quote">WARDEN: "IF IT REACHES THE SHIP, IT REACHES EARTH."</p>
    ${tools.map(t => `<div class="tool ${t.ready ? '' : 'lost'}"><span class="${t.ready ? 'ok' : 'danger'}">${t.ready ? '✅' : '❌'} ${esc(t.problem)}</span><br>
      ${t.ready ? esc(t.fix) : `${esc(t.name)} is gone. ${esc(t.fallback)}`}</div>`).join('')}
    <p class="hook">NEXT LESSON: fix what you can, with who you have left.</p>`;
  if (!animate) el.querySelectorAll(':scope > *').forEach(n => { n.style.animation = 'none'; });
  else el.querySelectorAll(':scope > *').forEach((n, i) => { n.style.animationDelay = `${i * 0.18}s`; });
  el.hidden = false;
}
async function transmit(animate) {
  const btn = $('#transmit');
  btn.disabled = true;
  btn.textContent = '📡 Transmitting…';
  const st = stationState(await storyChoices());
  renderReport(st, animate);
  btn.textContent = '📡 Transmitted';
  if (!S.transmitted) { S.transmitted = true; save(); }
  if (animate) $('#sz-report').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('#transmit').addEventListener('click', () => { if (!authBlocked()) transmit(true); });
if (S.transmitted) transmit(false);

// ── Boot ───────────────────────────────────────────────
const APPLY = { mcq: applyMcq, trace: applyTrace, branch: applyBranch, sort: applySort, fix: applyCode, reqs: applyCode };
ITEMS.forEach(it => APPLY[V[it.id].kind](it.id));
const startScore = refreshScore();
if (S.finished) showFinished(startScore, false);   // restore the look without re-celebrating
showTab(Number.isInteger(S.tab) && S.tab >= START ? Math.min(S.tab, REVIEW) : START);

// 💡 Get help is on, as in the Y8 assessment at the teacher's request: it explains what a Python
// error means, never how to meet a requirement. No step-through, no memory view.
setupEditors('.checker-textarea', { errorHints: true });
ITEMS.filter(it => V[it.id].turtle).forEach(it => attachTurtle($('#ed_' + it.id), { title: 'Beacon display', look: 'space' }));

preload()
  .then(() => { $('#pyStatus').textContent = 'Python: ready'; $('#pyStatus').classList.add('ready'); })
  .catch(err => {
    $('#pyStatus').textContent = 'Python: failed to load';
    window.ErrorReporter?.report('Python engine failed to load', err);
  });
</script>
</body>
</html>
